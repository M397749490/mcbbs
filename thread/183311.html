<b>标题: </b>关于被反灌水插件误封（有效期1天）的说明<br /><br />
如果您在某次发帖后被“有灌水嫌疑”为理由封禁1天，说明您因为在“短时间”内发“重复程度过高的多个主题帖”被系统自动暂封。<br />
<br />
如果您认为您确系被误判，可以选择在本版发主题帖申诉，也可以耐心等待。论坛管理员每天都会不定时查看反灌水插件的封禁列表，您会很快得到解封的。<br />
<br />
再次对此种现象的存在表示歉意！<br />
