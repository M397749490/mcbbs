<b>标题: </b>【神秘时代6】灵气发电机怎么使用啊？怎么给工业的机器供电？<br />如题，求大佬<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>mine新时代xs&nbsp; &nbsp; <b>时间: </b>2019-7-8 01:09<br />
灵气发电机会从当前区块吸取灵气，然后产生FE<br />
而工业的机器用的是EU，与FE不通用<br />
所以灵气发电机不能(直接)给工业的机器供电<br />
如果你有装能源转换器模组或者mekanism模组的话，你可以将FE当做RF转换为EU，然后就可以给工业的机器供电
