<b>作者: </b>筒子&nbsp; &nbsp; <b>时间: </b>2014-10-5 09:02<br />
创建一个权限组<br />
/mangadd a<br />
基础基础权限<br />
/mangaddi a Builder<br />
打开权限组<br />
/mangaddv a build true<br />
设置踩到的玩家都会被移动到a权限组<br />
再把A权限组的/spawn设置在你想设置的地方<br />
/setspawn a<br />
然后他们的/spawn就和别的玩家的/spawn分开来了
