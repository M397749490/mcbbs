<b>标题: </b>大地图小地图都没有是什么情况<br />新人，下了个某某懒人版1.7.2版，带forge的，但按X键显示的地图，还有右上角的小地图都没有，需要怎么安装？？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>超平坦之王&nbsp; &nbsp; <b>时间: </b>2015-1-12 22:26<br />
你打开之后，先按“M”键，也就是设置<br />
你刚刚说的“X”是显示大地图，是开了小地图之后才有的。<br />
“Z”是地图放大，大小地图都行，这会变的很不清晰。
