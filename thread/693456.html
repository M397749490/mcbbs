<b>标题: </b>如何让游戏不输出日志？<br />如题，我是一个服主，但是由于mod的原因，logs文件夹通常都会大到几G甚至是几十G，求助如何让客户端不输出日志<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>a1020669101&nbsp; &nbsp; <b>时间: </b>2017-6-2 11:14<br />
基本不太可能，输出大量log基本上是报错导致的，建议你先检查Mod是否有冲突或者是存在不兼容的情况，如果实在无法解决，你可以在开服脚本里写入这样一行<br />
del &quot;log&quot;<br />
这样你每次开服都会自动清空log了
