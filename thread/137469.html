<b>作者: </b>feizhaoxue&nbsp; &nbsp; <b>时间: </b>2013-7-4 16:38<br />
如果你指的是村民交易上的红叉的话，这是表示交易次数达到上限了。<br />
每个交易都会有交易次数，如果等于或超过就不能继续交易。但是交易完后村民周围会有紫色颗粒，然后交易选项会增多，所以不用担心你无法继续和村民进行其他交易
