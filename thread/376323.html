<b>标题: </b>服务器地图挪移之后用以前的名字登陆不上<br />就是换了个服务器商，然后把旧的地图搬过去了。用以前的ID登录不上去，会被服务器主动断开，换名字就可以上！<br />
<br />
比如我以前用【123】这个ID<br />
然后地图文件里【world/player/123.dat】删除之后<br />
<br />
我用123也能再上，以前的记录用不了了<br />
