1.6 和 1.5 的文件结构有变化。<br />
<br />
hmcl 用了一些办法使得旧版本也可以使用新版本的文件结构。<br />
<br />
比如老版本没有 .minecraft 文件夹，而是 bin <br />
<br />
1.6以下的玩家也太少了吧，所以去做兼容的启动器大概就很少了。
