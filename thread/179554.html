<b>标题: </b>村庄mod（中世纪mod）的一个问题<br />你成为村庄的首领后<br />
创建了允许自己控制的村庄<br />
但村庄只有四个建筑<br />
主城，两个伐木和一个树林<br />
无法创建新的建筑<br />
求解<br />
<br />
并且策划入侵后该怎么办？<br />
都已经策划100多个小时了还是没动静<br />
求解<br />
<hr noshade size="2" width="100%" color="#808080">
