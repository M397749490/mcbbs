<li>version: 4.8.4.4</ol></div><em onclick="copycode($('code_MiK'));">复制代码</em></div>给领地圈地之后，默认取消掉move权限(拥有领地权限的还是可以move)<br />
<br />
也就是圈地之后执行下面命令<br />
/res set &lt;领地&gt; move false<br />
