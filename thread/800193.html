月球地形是指怎样的，如果只是表面的话你可以用粘土覆盖表面啊，粘土和月球的颜色比较相近嘛，当然你也可以用末地石。至于那些环形山吗，你可以先用升降地形，圆型的，找一块区域江那里的地形突起，然后把笔刷的半径放小一点， 在你突起来的地形山脉中间在凹下去，结果呈现出外面高，中间却是低一点，像盆地一样的
