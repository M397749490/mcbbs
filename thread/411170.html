/mangaddv default prefix &amp;e[我是普通的小玩家]<br />
输入这个指令，给玩家组添加 [我是普通的小玩家] 称号<br />
default组是玩家组，如果你的玩家族不是default，自己改一下就行<hr noshade size="2" width="100%" color="#808080">
