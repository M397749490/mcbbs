<b>标题: </b>使用towny城镇插件后死亡后背包被清空<br />配置好了towny插件后在data世界里已经调整了是否在某世界启用，但是玩家在所有世界死亡后背包都会被清空，请问这是什么原因？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Korea&nbsp; &nbsp; <b>时间: </b>2019-7-18 14:42<br />
已自行解决，将config文件中的keep_inventory_on_death_in_town: 'true' 默认false改为true 一开始我以为这只是经验的 没想到会影响到背包
