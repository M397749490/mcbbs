<b>标题: </b>ILS自制装备怎么实现自动绑定？<br />ILS在自然怪物身上生成的装备都可以打下来就是绑定的<br />
那自己利用ils做的装备能做成拾取或者使用绑定吗？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Ir.Nep&nbsp; &nbsp; <b>时间: </b>2017-1-5 18:24<br />
可以的<br />
/ils lore [行数] Bound to &lt;玩家ID&gt;<br />
<br />
比如绑定一把钻石剑给玩家Kanzaki_Aria<br />
/ils lore 5 &amp;bBound to Kanzaki_Aria
