<b>标题: </b>第一次玩<br /><p style="line-height:nullpx;text-indent:2em;text-align:left"><font style="color:rgb(0, 0, 0)"><font face="&amp;quot"><font style="font-size:16px">为何我会幻想？它们弱小，一踩就死，那是我，疯狂而强撑微笑的我。到处是水，一滴一滴流走了曾经，模糊、模糊……那是梦，一双把我拉入世界的双手。</font></font></font></p><p style="line-height:nullpx;text-indent:2em;text-align:left"><font style="color:rgb(0, 0, 0)"><font face="&amp;quot"><font style="font-size:16px">我在空中翱翔，天它广阔。我想如精卫填海，填满海洋，因它在我的心甜中流淌。我拍打着双翅，看着放大了的世界，世间是时间把变化都扔给了你。——我成了小鸟。</font></font></font></p><br />
