<b>标题: </b>揭秘服务器所谓的多线<br />大家都看到，淘宝一些服务商，例如酷牛，icraft，都是好几线的，这能显示出他们服务器牛逼。<br />
但是，服务器怎么设置两根网线，好神奇，而且就算弄两根，成本太大。<br />
他们怎么弄的呢？<br />
揭晓！<br />
他们只是用另一个移动宽带的服务器，然后做个转向，你连接所谓的移动线的ip，其实绕了个圈子又连接到了他给你的普通ip，其实没什么用，除了证明自己服务器牛逼，就是拉价钱。所以线没什么用。
