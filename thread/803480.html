<b>作者: </b>九幽之帝&nbsp; &nbsp; <b>时间: </b>2018-7-6 08:57<br />
论坛会有权限受限的地方 <br />
例如你不能在公告和反馈版发帖 因为只有论坛管理级别的用户才能发帖 <br />
例如末路之地你只有到达七级之后才能进入 没有到达七级是不能进入的 <br />
且要想回复需要到达九级那样子才能回复 当然了还有些主题会被设置成锁定<br />
状态 这样自然也无法回复了的
