原创诗[失落的帝国]<br />
<br />
（下）我是海神之长子，<br />
时空涌流，<br />
亚特兰蒂斯。<br />
创世天神不应湮灭，<br />
迷失两宙之恒。<br />
圣苍波塞冬，<br />
请赐予我三刃之铮戟，<br />
逆天覆地，<br />
再现沧凉万顷亚特拉斯之亘宇荣耀。<br />
九州为洋，<br />
终结愚昧的陆上夷荒。<br />
天下三分，<br />
三分归我。<br />
谁需他人谱写，<br />
我即史诗，<br />
大西洲不灭！<br />
<br />
