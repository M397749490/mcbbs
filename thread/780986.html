<b>标题: </b>关于更多剑模组的一些问题<br />我在用更多剑模组的时候，发现了一些问题，如：当你附魔更多剑mod中的一个叫做“刃芒”附魔的时候，你的武器将无法击退目标，又或者你在附魔“刃芒”的之后，加入你又同时附魔了火焰附加和击退，这两个附魔都无法对目标有用，击退也无法击退，火焰附加也不能对其进行燃烧，请问这是什么导致的呢？我的版本为1.7.10<br />
