<b>标题: </b>服务器周目<br />现在服务器都说什么一周目、二周目什么的，什么是周目啊<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>星E君&nbsp; &nbsp; <b>时间: </b>2013-8-7 16:14<br />
周目就是说一共新开了几次地图。<br />
<br />
比如说你刚建一个服务器，那么就是第一周目。<br />
<br />
而你过段时间玩腻了换了一张地图，就是第二周目了。
