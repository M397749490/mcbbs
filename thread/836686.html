<b>标题: </b>在Un里面的尴尬事情怎么解决?<br />事件一:刚刚复活的地方，很幸运直接在军营边上，旁边就是农村，四五个僵尸外面走着。<br />
事件二:复活在城市门口，当你冒着生命危险进去搜索物质。结果出来后一**都是纸和衣服，背后还追着一群僵尸。<br />
事件三:复活在两只僵尸面前，然后被反复摩擦。之后再来一次时。被爬地小僵尸咬死。<br />
以上的这三个事件，我还能愉快的玩下去么。<br />
