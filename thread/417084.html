<b>标题: </b>怎么禁止玩家使用领地插件<br />也就是服务器装上领地插件，设置OP可以使用，玩家不能使用<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Agger_&nbsp; &nbsp; <b>时间: </b>2015-3-1 11:36<br />
输入指令/mangaddp Builder -residence.create或者<br />
打开配置文件(plugins/residence/config.yml)<br />
<br />
搜索AdminOnlyCommands<br />
<br />
把后面的false改成true<br />
<br />
然后重载插件就可以了
