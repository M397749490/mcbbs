<b>标题: </b>服务器tcp链接close wait<br />服务器tcp链接close wait<br />
服务器莫名其妙的就会卡掉。<br />
卡掉之后一般不会自动回复，后台输入命令没有任何反应，无崩溃日志，无崩溃记录。<br />
只有安全狗里的tcp监控里显示所有连接MC服务器端口的链接close wait。<br />
一旦关闭了其中的一个close wait 的链接，后台窗口就会有反应，就是服务器停止运行了，按下任意键那一个。<br />
