<br />
我只是猜想，当然真的有那就太好了<br />
就是玩家之间共享地图。玩家A加载了区块1，玩家B到达区块1的时候获取的地图数据不完全是从服务器传输过来，而是由玩家A的电脑部分传输。这样可以节省服务器的带宽，类似于迅雷P2P加速的原理，这样玩家越多，对服务器带宽的压力相对更小。<br />
不知道存在不存在这样的mod。感觉插件应该实现不了，寄希望于mod了。<br />
