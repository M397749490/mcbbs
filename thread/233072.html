<b>标题: </b>服务器的一个情况<br />就是进入服务器之后，他就一直下载地形中，然后服务端那头就执行关服指令！！！这怎么回事？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Lucky777777&nbsp; &nbsp; <b>时间: </b>2014-2-5 11:30<br />

&nbsp;&nbsp;一直加载地图可能是地图出错，删除world文件夹后重启会自动重新生成地图<br />
