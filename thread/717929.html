<font style="background-color:rgb(251, 242, 219)"><font face="微软雅黑"><font style="font-size:12px">12格指什么，指12个橡胶垫？下方十二格空间？不明白。</font></font></font><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>kbxxa&nbsp; &nbsp; <b>时间: </b>2017-8-9 23:20<br />
指的是你最多最多从12格高的地方跳下来到橡胶垫上，如果高于12格掉下来橡胶垫会被你踩烂并且有可能依旧会受到掉落伤害。。下方还是只留一格空格就行，橡胶垫也只用一个。
