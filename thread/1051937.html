<b>标题: </b>咏诗一首。<br /><div align="center"><font face="微软雅黑"><font size="5">本来，我在这时候，是不可能水帖的。但是，因为一场发烧事件打道回府了。</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">所以就有了这个帖。</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">加上，因为泥潭维护，所以我开学之前的最后一个帖，没能发出去。</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">所以多多少少还是有点遗憾。</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">现在，我想着，打算赋诗一首。</font></font></div><div align="center"><div class="spoiler"><div class="spoilerheader"><input type="button" class="spoilerbutton" value="展开 / 收起隐藏文字" onClick="n = this.parentNode.parentNode.lastChild;if(n.style.display == 'none') {n.style.display = 'block';} else {n.style.display = 'none';} return false;"/></div><div class="spoilerbody" style="display: none;border-style:inset;padding-right:5px;border-color: #ccc; "><table><td><div align="center"><font face="微软雅黑"><font size="2">卜算子·论水怪</font></font></div><div align="center"><font face="微软雅黑"><font size="2">泥潭大水怪，总是守规则。水到水榜前几名，仅仅只炫耀。</font></font></div><div align="center"><font face="微软雅黑"><font size="2">虽说只炫耀，但是不仅仅，攒帖完任涨积分，你就是王者。</font></font></div></td></table></div></div></div><hr noshade size="2" width="100%" color="#808080">
