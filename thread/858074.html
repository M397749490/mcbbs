这是正常情况&nbsp;&nbsp;由于服务器会自动卸载不活跃的区块&nbsp;&nbsp;切换地图的时候 区块被重新加载&nbsp;&nbsp;服务器性能不足的情况下是会卡的&nbsp;&nbsp;解决办法是降低服务器视距 或者提升性能<br />
server.properties 里面的view-distance=一项<br />
低性能服务器建议4或者以下<hr noshade size="2" width="100%" color="#808080">
