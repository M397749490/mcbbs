<b>标题: </b>Mythicmobs 的掉落物问题<br />比如说一个怪物掉落了“64”个物品，但掉落的东西可以堆叠成一堆，我想要把它分散且不能堆到一起要怎么办？(如果有类似这个办法的话也给予最佳答案）<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>807709429&nbsp; &nbsp; <b>时间: </b>2018-8-26 13:17<br />
可以在spigot.yml中的entity-activation-range选项设置实体活跃范围misc为凋落物设置大一点就可以吧凋落物分散开了但是这样掉落物品累积多了可能会卡服
