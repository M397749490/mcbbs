<b>标题: </b>把玩家分进去计分板里面之后 怎么设置删除某个组的某个道具<br />用计分板把玩家分进去某个组 比如是1<br />
然后我要定期删除组1的某个物品 命令方块的指令是什么呢？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>jiuerd&nbsp; &nbsp; <b>时间: </b>2015-4-25 11:32<br />
你把目标选择器换成<font color="DarkRed"><strong>@a[team=1]</strong></font>就可以了<br />
<br />
<font color="DarkRed"><strong>/clear @a[team=1] [物品] [数据]</strong></font>
