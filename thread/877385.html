<b>作者: </b>星&nbsp; &nbsp; <b>时间: </b>2019-6-26 14:23<br />
如果你是要获取全部在线玩家可以用Bukkit.getOnlinePlayers()<br />
如果你是要用玩家名字获取一个玩家可以用Bukkit.getPlayer(&quot;玩家名&quot;)<br />
如果你想获取一个玩家的名字那么就是player.getName()
