<font size="5"><font color="#ff0000">最近，【起床战争】这款小游戏变得格外的火</font></font><br />
<font size="5"><font color="#0000ff">关于起床战争，各位有没有什么自己的看法？</font></font><br />
<font color="#ff00ff"><font size="5">就是</font><font size="5">更新颖的玩法，当然是在原来的基础上稍作修改，而不是大改</font></font><br />
<font size="5"><font color="#ff00ff">也就是说，游戏的本体还是起床战争，就是比普通的起床战争多上一点不同的内容</font></font><br />
<font size="5"><font color="#00bfff">比如说，本来是四个队伍的，变成只有2个队伍，这样子的。</font></font><br />
<font size="5"><font color="#800080">有时候相同的玩法赶脚会玩腻哎。。</font></font><br />
