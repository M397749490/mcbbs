<b>标题: </b>魔改mod服务器加了，客户端可以不加进服吗？<br />如题，为了让客户端少一些mod<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>AAAA哥&nbsp; &nbsp; <b>时间: </b>2017-11-18 23:47<br />
这个是不行的，服务器增加了什么mod，客户端一定要有，否则无法进入服务器。因为服务器需要判定客户端是否有指定mod。<br />
打个比方，如果你服务器有神秘和工业，客户端没有工业也能进服务器，那么玩家进服务器就会失去工业这个模组的效果。
