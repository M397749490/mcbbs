<b>标题: </b>如何让Bungee正版模式在处理PendingConnect的时候不踢出盗版玩家。<br />服务端进行正版验证的原理是 通过Mojang查询正在连接的玩家的最后连接服务器是否是本服务器。<br />
如果是 就通过验证，反之则踢出。<br />
我现在不希望服务端踢出玩家，而是将该玩家的名字存入数据库。<br />
<br />
我有服务端开发经验，可以直接告诉我原理，或者Bungee实现“setOnlineMode(true)”的地方。<br />
