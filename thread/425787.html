<b>标题: </b>方块酱武器问题<br />怎么修改能使方块酱可以使用自定义NPC里的武器？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>叶无夜&nbsp; &nbsp; <b>时间: </b>2015-3-24 21:09<br />
修改NPC自带的武器你需要去解压NPC模组，在里面翻找NPC武器贴图的文件夹然后想修改那个武器就复制武器的名字，然后把想要替换的武器贴图名字修改成同样的然后丢进去选择替换就完成了！
