<b>标题: </b>有几个区块严重掉帧怎么破？<br />地图里有几个区块一靠近就严重掉帧，怎么办？<br />
造的东西多了，不想移地图。<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>ff98sha&nbsp; &nbsp; <b>时间: </b>2017-6-9 22:47<br />
1.降低渲染距离。2.将图像品质设定为流畅。3.在Minecraft开启时关闭其他程序在Windows Vista/7中关闭Aero。4.检查显卡并确认抗锯齿为关闭状态。5./kill @e杀死所有生物。<br />
如果还是不行建议卸载区块，或用mcedit导出区块
