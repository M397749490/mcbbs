<b>作者: </b>古往今&nbsp; &nbsp; <b>时间: </b>2016-1-23 08:12<br />
拿手去撸东西就行了<br />
升第二级手撸五十多块木头就行了<br />
第二级就可以挖石头了<br />
第三级煤炭可以挖了<br />
第四级黄金，钻石，红石都可以挖了<br />
第五级黑曜石能挖了<br />
第六级约为效率钻稿<br />
一定要用手挖，不然没经验升下一级<br />
例外每级会加攻击<br />
可以在配置改<br />
以后你的攻击就是手撸伤害+武器伤害<hr noshade size="2" width="100%" color="#808080">
