<b>作者: </b>CatSeed&nbsp; &nbsp; <b>时间: </b>2015-10-16 23:46<br />
<b>标题: </b>关于论坛任务的两个建议<br />1.建议彻底删除<br />
<strong>【新人任务?】领取新人勋章</strong><br />
<br />
这个任务原因如下<br />
仅LV0可以申请 很多时候如果不知道任务会错过<br />
如果有强迫症那么就很想完成这个任务 可是&gt;0级就无法完成<br />
<br />
<br />
2.删除任务或取消等级限制<br />
<br />
<strong>【新人任务①】新手升级红包</strong><br />
理由同上 个人认为不应该存在<br />
“当一个人知道有任务就可以比一个不知道任务的人多拥有5初始积分”这件事<br />
完全可以开放所有用户领取的权限<br />
<br />
且人气对总积分没有大影响（加上去也就多15总积分）<br />
<br />
<br />
