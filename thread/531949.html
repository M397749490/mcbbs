经常会卡住一会<br />

<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>matrix67&nbsp; &nbsp; <b>时间: </b>2015-12-18 11:09<br />

打开PluginMetrics<br />
将config.yml里<br />
opt-out: false<br />
改为<br />
opt-out: true
