<b>标题: </b>1.7.9联机闪退<br />和朋友用内建的联机功能联机，局域网。<br />
一人点击“对局域网开放”后，另一人可在多人游戏里搜索到，但连接进行到“登陆中”后会直接闪退，游戏关闭，没有报错。<br />
两台机器都是WIN8,游戏版本都是1.7.9原版，无任何MOD，启动器都是MCLauncherBN。<br />
