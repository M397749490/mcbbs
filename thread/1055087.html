<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>凌坤坤&nbsp; &nbsp; <b>时间: </b>2020-6-1 10:13<br />
武器攻击时有几率会锁住附近的怪物，1-4只的样子，让他们无法行动1-3秒，根据附魔等级而变。<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>番茄茄&nbsp; &nbsp; <b>时间: </b>2020-6-1 12:11<br />
将正在被你攻击的怪和周围的几只怪连锁起来，被连锁的怪都不能动弹。越级刷图的时候是个蛮好用的附魔，防止被一波围死
