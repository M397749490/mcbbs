论坛总版规也有提到对挖坟处罚：<div class="quote"><blockquote>P.在默认以回帖时间排序的板块回帖挖坟：通过其言辞判断：无心之过，口头警告；蓄意挖坟，黄牌第一次警告。</blockquote></div><br />

<br />
所以请各位茶客不要挖坟，营造一个和谐的茶馆。<br />
