<b>标题: </b>关于mod<br /><font color="#0000ff">游戏操作<br />
</font>《Minecraft》操作相当简单。具体如下：<br />
鼠标左键 - 攻击/使用工具<br />
鼠标右键 - 打开箱子/放置物品<br />
W - 前进<br />
S - 后退<br />
A - 左平移<br />
D - 右平移<br />
空格 - 跳跃<br />
左Shift - 潜行<br />
Q - 丢弃物品<br />
I - 打开物品栏<br />
T - 聊天<br />
F - 雾化范围<br />
F5 - 切换第一/第三人称<br />
F11 - 切换全屏<br />
