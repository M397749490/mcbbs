<b>标题: </b>闲的没事搞个tnt炮<br />这个TNT炮只需要在红石块上放置TNT就可以直接发射（放置的瞬间触发观察者，再被推出去）<br />
1.先放一个红石块，建议离地面几格高<br />
2.再放一个观察者注意观察者方向<br />
3.在向图里一样摆方块（随意）<br />
4.放置一个粘性活塞和一个粘液块<br />
5.放上红石<br />
这样就做好了一个极简的TNT炮<br />
<br />
射程约10格子
