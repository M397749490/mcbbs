<b>标题: </b>随笔两首小诗<br />（一）<br />
叮咚叮咚……<br />
瞬间无数个灰色的影子，<br />
瞬然而去。<br />
呼吸着这腐败的空气。<br />
看着他人那可笑的眼神。<br />
如行尸走肉，<br />
<br />
（二）<br />
他人诡异的目光<br />
自已颓废的脚步<br />
不断走下去……<br />
看着周围灰色的一切。<br />
颓唐的笑着，<br />
慢慢地前进。<br />
