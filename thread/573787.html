按F3，然后找到<br />
<a href="https://www.mcbbs.net/plugin.php?id=link_redirect&target=https%3A%2F%2Flightpic.info%2Fimage%2Fdetail%2F9B87_57085D9E0" target="_blank"><img id="aimg_g8Q6v" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" src="https://public.lightpic.info/image/9B87_57085D9E0.jpg" onmouseover="img_onmouseoverfunc(this)" onload="thumbImg(this)" border="0" alt="" /></a><br />
chunk：到in中有三组数字<br />
只看第一组和第三组<br />
当这两组的数字由0→15时，就是一个区块的长度，in后面的是区块的坐标<br />
然后从一个点走那么四次就好了（这期间in后面的坐标不能改变，否则就是另一个区块）<br />
<br />
至于你说的以前那个，估计是NEI的F9
