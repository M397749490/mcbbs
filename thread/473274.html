<b>作者: </b>ご绯尘丨ゞ&nbsp; &nbsp; <b>时间: </b>2015-7-22 13:03<br />
<b>标题: </b>1.7.2怎么让指定权限组才有权限传送到指定地点<br />例如 我有个 御坂权限组 我想让服务器里只有这个权限组才有权限传送至 御坂公会<br />
<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>ColorsWind&nbsp; &nbsp; <b>时间: </b>2015-7-22 13:03<br />
使用领地插件<br />
把你要保护的地方圈地<br />
然后站在领地上 输入<br />
/res set move false<br />
/res gset &lt;用户组名称&gt; move true
<br /><br /><br /><br /><hr noshade size="2" width="100%" color="BORDERCOLOR">
