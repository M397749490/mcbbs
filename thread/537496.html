<b>标题: </b>教你制作tr怪物陷阱（注意：可能误杀）（无图）<br />1.你需要：<br />
电线若干<br />
扳手<br />
电工钳（如果你确信自己不会放错的话不需要）<br />
<font color="#ffff00"><font style="background-color:blue">黄色</font></font>压力板（其它颜色不行）<br />
陷阱机器：毒箭机关或岩浆或神庙刺球机关等<br />
毒箭机关：毒箭机关和<font color="#ffff00"><font style="background-color:blue">黄色</font></font>压力板放到一起，毒箭指向压力板，用电线连接<br />
岩浆：挖一个一格深的洞，放上机关石墙，倒入岩浆，放上压力板（但必须手动取消）<br />
刺球机关：压力板在下刺球机关在上，要有5格以上，且防止刺球乱跑即可<br />
