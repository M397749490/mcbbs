<b>标题: </b>1.16粘液科技的强化熔炉怎么用<br />做了个黑金刚石强化熔炉，燃烧速度和燃料利用率都正常了，产量理论上说应该是3倍，可是无论是漏斗漏还是直接gui里看，仍然还是1个烧出1个，所以想了解下，是不是有什么特殊的取出方法，还是3倍产量是概率性的。<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Neige&nbsp; &nbsp; <b>时间: </b>2020-8-17 19:58<br />
三倍产率是概率性的，而且有针对性，只对一部分物体有效。（比如铁矿金矿）而且首次必出1倍。所以用漏斗传输的话将浪费一小半的产能。
