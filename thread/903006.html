<b>标题: </b>玩游戏的态度<br />游戏是为了娱乐，休闲的，但是我在玩游戏的过程中碰到很多的人，其中有一部分得人会因为游戏而大发雷霆，然后我就在想，这样值得吗？这只是一个游戏，本来就是让你娱乐的，然而却成为了让你生气的东西，感觉太不值得了，而且人生气起气来可能会做出不可预料的事情，所以说，要持有一个良好的心态去玩游戏。这是我个人的观点。不喜勿喷呀~<br />
