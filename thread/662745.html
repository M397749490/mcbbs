<b>标题: </b>地皮权限指令是啥<br />我服务器玩家领取不了地皮！求解<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>古明地兔&nbsp; &nbsp; <b>时间: </b>2017-1-15 11:01<br />
首先先给玩家使用地皮权限：/mangaddp builder plotme.use<br />
然后再给玩家领取地皮权限：/mangaddp builder plotme.limit.x<br />
注意！：<br />
①builder是权限组名<br />
②第二个指令末尾的x是指玩家可以领取的地皮数量，利用这条指令也可以设置VIP等组可领取地皮的数量。
