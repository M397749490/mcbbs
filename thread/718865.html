<b>标题: </b>普通采矿机和高级采矿机什么区别<br />普通的能放铱钻头么，工业mod<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>lilinjie&nbsp; &nbsp; <b>时间: </b>2017-8-11 19:07<br />
普通采矿机需要放电钻扫描仪和采矿管道（普通的采矿范围16格，高级的为32格）普通的不可以做任何设置<br />
高级采矿机需要放扫描仪通电（还可以设置精准采集），还可以用高压升级加兰波顿水晶，这样可以不使用线缆，同样还可以设置黑名单，当然高级的也有点贵
