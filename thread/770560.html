<b>标题: </b>对CoreProtect数据迁移其他世界名的改动方法<br />由于我把某某世界名(就是主城)更换，导致登陆时会短暂传送到world的世界，因此写了这个教程，某数据对世界名更改<br />
首先，你会看到数据库co_系列一大堆，然后你要看到那一系列出现wid列，那个就是世界id，之后只要把在co_world上的id做更改即可。<br />
最后，说一下，这个教程本身没什么卵用，因为我知道，你们根本不会看的。<br />
