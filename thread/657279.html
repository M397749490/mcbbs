<b>标题: </b>服务器<br />呃呃..如果要开一个大约500人的服务器。。要准备哪些东西。。像机房什么的。。各种硬件配置要多高？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>你的世界003&nbsp; &nbsp; <b>时间: </b>2016-12-27 14:18<br />
500人的服务器需要专业级别服务器硬件，并且插件和服务端方便也要优化的的很好。硬件方面，如果你真要500人在线，内存至少也得32G吧，另外就是CPU得16线程主频3G以上，你的端还得选支持多线程的，带宽…50M吧。都是个大约数值，而且以单端为例，实际上大服基本都是走群组路线
