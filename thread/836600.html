<b>标题: </b>支持蹦极与不支持蹦极<br />找服务器核心的时候看到有的端支持蹦极，想知道支持和不支持的区别和作用。<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Zapic&nbsp; &nbsp; <b>时间: </b>2019-1-5 12:18<br />
支持蹦极即支持BungeeCord转发,能让多个服务器连接起来互相跳转,而玩家只需要通过1个IP地址就能连接到所有的子服务器.<br />
不支持则相反.<br />
作用呢,这个功能只对大型服务器有很大的作用,能综合多种玩法于一个服务器.小型服务器一般就没必要这么弄了.
