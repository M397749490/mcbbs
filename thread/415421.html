<b>标题: </b>关于领域服地图上传<br />自己单机做了副地图上传到了领域服，第一次上传并验证成功，但是在领域服玩的时候不小心破坏了地图一些关键部分，懒得再领域服重新做，于是就准备重新上传一次，结果同一副地图第二次上传告诉我上传失败，超过上传限制（6004），前面就是失败提示的原文，明明同一副地图为什么第二次会超过上传限制呢_(:з」∠)_，不知道有没有大大知道怎么回事，或者有没有大大知道领域服上传地图的限制是多少。<br />
