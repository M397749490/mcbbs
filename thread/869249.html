<b>作者: </b>小cheng&nbsp; &nbsp; <b>时间: </b>2019-5-27 10:29<br />
目前还没有禁止传送的插件，如果楼主想让玩家不能传送到等级限制的副本，可以圈地然后禁止传送【/res set tp f】这样子在领地内传送会被禁止，或者单独取消玩家传送权限，一般rpg服都不需要ess带的基础指令的，或者一些传送插件的。
