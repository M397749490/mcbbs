<b>标题: </b>rpgltem的武器属性问题<br />我想做一把rpg武器附带百分之50几率中毒，可是该输入什么来代表几率<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>梅子酒呀&nbsp; &nbsp; <b>时间: </b>2017-6-22 23:00<br />
文本: 50%<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>梅子酒呀&nbsp; &nbsp; <b>时间: </b>2017-6-22 23:05<br />
/rpgitem ID power potionhit damage 80 3 poison 2<br />
这个指令是攻击敌人时50%几率对对方造成3级的中毒效果，持续80刻，也就是4秒<br />
