<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>djnnnnnnna&nbsp; &nbsp; <b>时间: </b>2017-1-1 22:47<br />

然后输入/npc skin 皮肤名(正版玩家名字)<br />
