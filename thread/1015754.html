2.9G非常正常，服务器端没有任何可删除的内容。<br />
如果硬要说减少空间，如果有coreprotect就把数据库连到外置MySQL，如果有dynmap就设到Vlow-res最低分辨率并且只设置一个平面渲染。<br />
如果你的玩家酷爱跑图，可以装worldborder并把没人的区域给剪掉，也可以省存储<br />
不过话说回来我的小服新周目三个月就25G了）
