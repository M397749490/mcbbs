<b>标题: </b>关于材质内容<br />如果本人整合的一个PVP材质，其中用了许多材质，如盘灵古域之类的，那我把这个材质包上传的话，原贴地址要怎么写，需不需要向其他材质包的作者请示？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>麦白&nbsp; &nbsp; <b>时间: </b>2016-5-15 09:47<br />
如果你是用了许多材质合成的材质，请选择半原创<br />
原帖地址就是你发表的半原创帖子的地址<br />
如果你觉的需要向其他材质包作者请示，可以去请示的。
