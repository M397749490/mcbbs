这个是宝藏箱插件，直接在空箱子放入你想要给玩家的道具<br />
对着它输入/tchest set 设置为宝藏箱<br />
注意，设置的时候箱子上方一格不可以有阻挡物<br />
玩家打开就可以领取你设置的道具了，默认每个玩家可以领取一次
