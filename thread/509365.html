default_server<br />
默认值：lobby<br />
描述：玩家第一次进入BC群组时，连接到的服务器，一般设置为登陆服<br />
force_default_server<br />
默认值：false<br />
描述：如果设置为true，玩家每次登陆到BC群组时，都会进入你设置的默认服务器（一般是登陆服）；如果设置为false，那么玩家加入BC群组时会进入上次退出的服务器<br />
