<b>标题: </b>格雷配置<br />格雷的自动系列机器变回工业的该怎么改配置文件？<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>琥珀剑心&nbsp; &nbsp; <b>时间: </b>2014-6-9 11:28<br />
修改配置文件就行了<br />
格雷科技本身就预留了这个功能<br />
配置文件中的usefullrecipes后面的那一堆<br />
就是Expensive打头Recipe结尾的那部分，就是“昂贵的XXXXX配方”<br />
比如ExpensiveWindRecipe=true就是启用格雷的贵的要死的风电配方替换IC2配方<br />
如果把true改成false就还原成了IC2配方
