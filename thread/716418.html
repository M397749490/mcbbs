称号前缀变量是:&quot;prefix&quot; 还可以添加尾缀,变量是:&quot;suffix&quot;<br />
命令:/mangaddv 权限组名字 变量 &amp;颜色代码和称号样式<br />
例子:/mangaddv VIP prefix &amp;4VIP 设置名字叫VIP的权限组添加深红色、称号是VIP的前缀.
