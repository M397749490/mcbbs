<b>标题: </b>地理mc 第一期<br />大家好，我是mc小莫，今天的地理mc将讲述沼泽地里的建筑、特产和特色。<br />
<img id="aimg_U6026" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" src="http://img14.poco.cn/mypoco/myphoto/20130205/12/173443682201302051257036844976004792_001.jpg" onmouseover="img_onmouseoverfunc(this)" onload="thumbImg(this)" border="0" alt="" /><br />
沼泽地里常常会出现一种小屋，里面有工作台和炼药锅，还有一个小花盆（里面种着蘑菇），这屋子比平常的屋子高，要跳到2个方块上才能跳进去。<br />
<img id="aimg_DYn5u" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" src="http://img14.poco.cn/mypoco/myphoto/20130205/12/173443682201302051257036844976004792_000.jpg" onmouseover="img_onmouseoverfunc(this)" onload="thumbImg(this)" border="0" alt="" /><br />
泥潭里的草方块颜色很深，水也是绿的。特产睡莲和藤蔓，里面有很多水坑，到处都是橡树。晚上怪物也挺多的，不适宜人住。<br />
