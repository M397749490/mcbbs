<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>思念化作海&nbsp; &nbsp; <b>时间: </b>2020-4-1 20:20<br />
png格式的图片 丢到plugins/HolographicDisplays里 重载<br />
/hd create &lt;编号&gt;<br />
/hd edit &lt;编号&gt;<br />
/hd readimage &lt;编号&gt; &lt;图片名称&gt;.png &lt;长宽&gt;<br />
长宽最大100<br />
<br />
不过生成出来的很糊 而且会卡客户端 建议用MOD来展示图片，
