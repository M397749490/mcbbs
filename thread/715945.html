<b>标题: </b>实用宠物会覆盖怪物萌化的问题<br />自己尝试了一天没弄好，试试看能不能找到大神帮忙解决。<br />
<br />
问题是怪物萌化的狼模型和贴图与原版的狼不一样，用了实用宠物驯服后变回原版的狼。<br />
有试过修改jar里面的贴图，但是修改过后驯服完狼的皮肤变的很混乱，而且模型没有变化。<br />
于是我找了一圈怎么修改模型，没有找到方法。<br />
<br />
求解决，只要让实用宠物驯服的狼变成怪物萌化里的狼就行了。<br />
