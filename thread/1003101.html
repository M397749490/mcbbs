<b>标题: </b>关于手机端的帖子编辑功能的问题<br />电脑版上，只要是自己的帖子/主题，发出后任何情况下都可以编辑。<br />
手机版上，自己的主题任何情况下都可以编辑<br />
但回帖不一样：<br />
假如你发出回帖后没有人在你后面发，那么就可以编辑<br />
而假如你发出回帖后，有人跟在你后面已经发过了，就再也无法编辑了，但此时仍然可以在电脑版上编辑<br />
希望对此予以处理。<hr noshade size="2" width="100%" color="#808080">
