<b>标题: </b>这种东西怎么做？<br />一个箱子，通过某种电路连着一个门，当箱子里是空的时，门开，当箱子里有东西时，门关上。<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>BensonQC&nbsp; &nbsp; <b>时间: </b>2015-2-9 19:10<br />
只要在箱子后面放置红石比较器，如果箱子中有东西的话，红石比较器会输出信号，并与箱子内物品的数量有关系。<br />
一般只要探测箱子内是否有物品的话，在箱子后面分别放置红石比较器和红石中继器。<hr noshade size="2" width="100%" color="#808080">
