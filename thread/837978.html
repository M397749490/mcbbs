<b>标题: </b>关于出生点<br /><div align="center">关于我服务器的一个bug？</div><br />
<div align="left"> 只要玩家一死 就会传送到其他地方 而不是我设置的出生点&nbsp; &nbsp;&nbsp;&nbsp;重新设置出生点也没有用 求个解决的办法。</div><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>mc能吃吗&nbsp; &nbsp; <b>时间: </b>2019-1-17 11:03<br />
先设置出生点 之后把EssXspawn插件删掉<br />
我服务器也出现过这样的问题 最后解决了<br />
但如果您的服务器有其他设定出生点的插件的话可能是冲突问题啥的
