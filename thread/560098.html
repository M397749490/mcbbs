<b>标题: </b>minefactory镭射钻问题<br />不同颜色的聚焦透镜是怎么计算增加掉率的，某种放置多个是否能提高出矿效率？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Black_little&nbsp; &nbsp; <b>时间: </b>2016-2-21 23:08<br />
透镜的颜色与其增加的矿物掉率有关。<br />
比如说绿色透镜增加绿宝石的掉率，<br />
红色增加红石的掉率。<br />
多个放置效果可以叠加。不同颜色的透镜也会共同起作用。<br />
求最佳{:10_492:}
