<b>标题: </b>Lwc箱子锁的漏斗功能有什么用<br />不造能干什么<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>速升轩&nbsp; &nbsp; <b>时间: </b>2016-3-16 13:25<br />
锁住漏洞,PlotMe默认能空手打开漏洞<br />
漏洞下面放箱子 或漏洞都能把漏斗的东西拿走<br />
防止别人放的箱子或漏斗漏走东西<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>chyr&nbsp; &nbsp; <b>时间: </b>2016-3-16 16:43<br />
漏斗放在上锁的箱子(或机器)，上锁的箱子是不会漏入或漏出物品的。<br />
输入[/chopper on] 然后点击箱子，则开放箱子物品的流通。
