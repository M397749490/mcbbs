<b>标题: </b>服务器监狱的基本指令<br />如题，求服务器的监狱的基本指令<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Nerey&nbsp; &nbsp; <b>时间: </b>2015-5-8 21:37<br />
/setjail [名字]<br />
设置一个监狱<br />
/togglejail [名字]<br />
把玩家送进xxx监狱，永久封存<br />
/tjail [ID] [监狱名字] [时间]<br />
把玩家扔到指定的监狱多少时间.1d, 1h ,1w 等等<br />
/unjail [ID] [监狱名字] [时间]<br />
多久后把玩家解放出来<br />
/deljail [ID]<br />
删除某个监狱
