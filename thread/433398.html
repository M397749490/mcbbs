<b>作者: </b>我真的是cat&nbsp; &nbsp; <b>时间: </b>2015-4-14 12:37<br />
增值方法：铀棒用完 一定几率会变成近衰竭铀棒 但是还不能发电。 首先要与煤粉合成 放在一个正在运行的反应炉里的一个能发电的铀棒旁边 就会慢慢吸收能量 吸满了再用煤粉合成就可以重新发电了。 <hr noshade size="2" width="100%" color="#808080">
