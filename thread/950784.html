<b>标题: </b>mods文件夹在版本号文件夹里面<br />安装forge后<br />
mods文件夹出现在.minecraft/versions/版本号/mods<br />
而不是原本常见的.minecraft/mods<br />
虽然我知道这没有多大影响<br />
但是我想知道为什么会这样？<br />
怎么控制它在哪个文件夹？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>肆火&nbsp; &nbsp; <b>时间: </b>2020-2-3 10:01<br />
这是因为你的启动器开启了&quot;版本隔离&quot;功能，关闭即可。然后把mods移回原本的位置
