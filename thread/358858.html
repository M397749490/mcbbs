<b>标题: </b>二战武器包问题.<br />二战包里有个旗帜 那个旗帜一按在地上就没法删除了，求大神告诉下怎么删除旗帜.<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>qq3922382&nbsp; &nbsp; <b>时间: </b>2014-10-29 08:46<br />
进入创造模式，输入指令/teams getSticks&nbsp;&nbsp;然后会获得四个木杖(前提是背包有四个空位)，找到毁灭木棍，对准旗子右键，旗子消失。
