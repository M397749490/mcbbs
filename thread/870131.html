<b>标题: </b>关于pvp的一个问题<br />如何在bukkit里检测玩家正在pvp和没有pvp,最近想弄一个脱战回血的插件没有思路..<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>壹陽峙&nbsp; &nbsp; <b>时间: </b>2019-5-31 23:10<br />
玩家正在被攻击/攻击别人就把他放入一个map里缓存，格式为&lt;Player,Integer&gt;<br />
integer设置为冷却时间，比如被攻击或攻击后几秒停止，就算停止pvp。<br />
再弄个线程，定时判断遍历所有玩家并判断map是否为零或为空。<br />
如果是，就回血<br />
如果不是，就把这个玩家的值减一。
