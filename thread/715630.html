<b>标题: </b>存档问题<br />如果在储存模式设为“应用程序”后创建世界（即存档保存在手机根目录），如何导出？<br />
（不roo的情况下）<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>fsxitutu&nbsp; &nbsp; <b>时间: </b>2017-8-5 16:34<br />
在第三方recovery下挂载/data，使用文件管理器(twrp自带，或使用aroma)拷出来。recovery是由init进程直接启动的，本身就是以root用户运行的。所以不需要进行root操作
