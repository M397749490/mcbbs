<b>标题: </b>关于拔刀剑中无神和狐月刀的锻造<br />好的拔刀合成出来就自带附魔，附魔越好锻造需要的等级越恐怖，像是无神的附魔就十分恐怖了，这样的刀要想锻高基本无望，不过包括无神，狐月刀之类的用鞘合成的刀可以通过锻鞘的方式增加锻数，鞘的锻数在合成为刀后会保留，这样千锻无神就能做出来了。<br />
