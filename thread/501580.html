<b>标题: </b>&lt;原创·单章·诗词&gt;《饥饿游戏胜后又何妨？》<br /><div align="center">此诗抒发了作者对美好地形的向往，对社会的不满。</div><br />
<div align="center">一望阔海无陆地，</div><br />
<div align="center">愿辞黄名(1)作白丁(2)。</div><br />
<div align="center">若上此局望得赢，</div><br />
<div align="center">千载连胜此中尽。</div><br />
<div align="center">————————————————</div><br />
<div align="center">1:赢了一局饥饿游戏后会出现黄色的名字</div><br />
<div align="center">2:普通的百姓</div><br />
