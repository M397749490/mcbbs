<b>标题: </b>魔戒和虚无你更喜欢哪个？<br />&nbsp; &nbsp; 对我而言，第一感觉这虚无就是水水水，看看那些伤害差不多，材质很粗糙的剑，攻击方式没什么新意的boss，还有那可怕的掉率，这些因素使我觉得这个模组<strong>很垃圾</strong>。<br />
&nbsp; &nbsp; 魔戒就好很多，他里面的那些NPC系统，自然生成的建筑物和各种物品的材质真的看着很舒服。所以我觉得魔戒比虚无好太多。<br />
&nbsp; &nbsp; 可是魔戒的名气似乎没有虚无那么响诶，这使我无法理解。你认为哪个模组更好呢？留下你的评论吧<br />
