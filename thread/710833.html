神秘又不是一时半会能教会的，解笔记应该是最麻烦也是最重要的一环，首先你要知道元素连线的依据是包含于被包含的关系，比如说光明是风+火，那么他就可以和风/火连线，反之亦然，当一个笔记的所有元素相连（不一定要成为一个圈，连起来就行）就完成了笔记的解读，多多摸索练习就可以熟练的解了
