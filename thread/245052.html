<br />
然后NPC设置成银行功能&nbsp; &nbsp; 编辑选择你设定的银行名字<br />
<br />
其他NPC用银行功能也选择这个全局银行名字的话<br />
<br />
那么这2个NPC的银行功能里面的物品就是 通用的
