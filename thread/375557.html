<b>标题: </b>开服内存累计？<br />服务器运行一天默认x设置内存2G&nbsp;&nbsp;开服一天后内存使用 1.5 G<br />
<br />
开服第二天内存使用 2G<br />
<br />
开服第三天内存使用 2.5G<br />
<br />
这样内存叠加是怎么回事 服务器没断开过 是要定时重启缓冲吗？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>回忆都市&nbsp; &nbsp; <b>时间: </b>2014-12-17 23:05<br />
这个应该是 JAVA 的问题吧，&nbsp;&nbsp;JAVA 不能手动施放内存，只能依靠垃圾回收机制来 回收无用内存，但是有些内存是没有被回收的，所以就占着了。&nbsp;&nbsp;定时重启还是不错的。
