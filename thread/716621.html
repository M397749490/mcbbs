<b>标题: </b>Yum<br />请问<br />
Yum插件会自动更新？<br />
更新时会造成服务端崩溃？<br />
还是如何？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Bright_C&nbsp; &nbsp; <b>时间: </b>2017-8-7 10:18<br />
yum不会自动更新,他会检查更新并提示你是否更新<br />
<br />
你可以更新也可以不更新.更新时候,服务器会下载一个yum最新版到配置文件夹<br />
然后要输入/yum upgrade&nbsp;&nbsp;即可以更新到最新版本<br />
如果不想输入以上的,重启服务器也可以直接替换成最新版本
