你是要安装MD5反作弊吧。<br />
因为正版的文件都在C:\Users\user\AppData\Roaming\.minecraft里，安装mod可以。但是制作整合包不太现实。<br />
如果你是正版验证服务器，用一个支持正版登录的启动器制作整合包，添加反作弊mod即可。<br />
