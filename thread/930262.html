<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>AzureHanChen&nbsp; &nbsp; <b>时间: </b>2019-12-6 17:58<br />
请检查您给予玩家权限指令的参数<br />
/pex user 玩家 add 权限<br />
如果您只想给玩家一个权限,那么后面不能再有参数<br />
否则根据插件说明 将作为世界参数 只在此参数对应世界生效
