<b>标题: </b>关于AE2的BUG<br />如题，我的服务器加了AE2但不知道有什么BUG，求各位大神爆料一下！<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>heimi_s&nbsp; &nbsp; <b>时间: </b>2016-7-31 13:40<br />
AE2配合IC2的高级太阳能可以无限刷东西，方法为把AE2的储存原件放到高级太阳能的GUI里面然后另外一个人敲掉太阳能，太阳能不会被破坏，但是原件会掉出来，但是太阳能里面仍然有一个原件，利用这个BUG把物品存到原件在刷原件就可以无限刷物品了
