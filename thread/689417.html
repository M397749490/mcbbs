<b>标题: </b>教大家怼方块qwq<br />在MC服务器里（更多是rPG）常常为了卡位走到高点（我都这么干的），这时你需要一个方块（任务物品或把什么东西合成，如粘土）<br />
然后在需要怼方块的这个方块里，鼠标朝下，不停跳跃不停拿着方块按右键，你会发现你虽然没权限但是好像踩到了你放的方块上来了（这个要注意节奏不能乱来）<br />
