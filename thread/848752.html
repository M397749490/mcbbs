<br />
刚刚在手机端看创意馆，想用“热门”排序。翻了几页以后偶然发现，排序恢复了默认的排序(即“全部”排序)。尝试了几次后发现，不管哪一种排序，只要切换了页码，都会恢复成默认排序。在其他版块测试时发现也存在这个问题。<br />
纠正一下，刚刚测试了一下，“最新”排序无此问题，只有“热门”排序存在此问题
