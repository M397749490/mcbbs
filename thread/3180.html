<b>作者: </b>laoyike&nbsp; &nbsp; <b>时间: </b>2011-3-12 18:54<br />
<b>标题: </b>为什么我越玩越卡<br />我玩着玩着，就卡了，之后按 F 就不卡了,之后又卡了?<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>god-dog&nbsp; &nbsp; <b>时间: </b>2011-3-12 18:54<br />
F是控制視野（霧的大小）的，視野越大就越卡。<br />
可能是你在探索世界時，地形在刷新創造，所以卡。<br />
也可能是你在樹木或動物比較多的地方。<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>599056390&nbsp; &nbsp; <b>时间: </b>2011-3-12 19:09<br />
F是用来调整能见度的<br />
按F卡的话是你显卡太神了
