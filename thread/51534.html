<b>标题: </b>单机有没有像mcmmo插件一样的MOD？<br />单人游戏有没有像mcmmo的MOD？就是那些什么挖矿技能的<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>halfcigarette&nbsp; &nbsp; <b>时间: </b>2013-10-20 19:23<br />
答案是没有。<br />
mcmmo是一个插件而不是一个mod。<br />
插件只能装在服务端。<br />
所以，只开客户端玩单机是不能用mcmmo的。<br />
<br />
解决办法：在自己电脑开服务端，安装mcmmo，再开客户端，上自己的服务器自己玩。选多人游戏，ip输入127.0.0.1
