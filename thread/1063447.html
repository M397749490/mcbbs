<b>标题: </b>如何更改游戏角色存档数据<br />我开了个私人小服，有个人进游戏角色存档消失了，据他称没有更改名字，那么如何更改存档文件把旧角色存档数据放到新角色上<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>南柯郡守&nbsp; &nbsp; <b>时间: </b>2020-6-18 07:54<br />
在world/playerdata文件夹下搜索他旧的uuid和新的uuid<br />
然后把旧的uuid文件名改成新的uuid文件名 把新的那个uuid文件删除就行了<br />
<br />
建议操作前先把两个uuid文件备份
