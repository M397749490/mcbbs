<b>作者: </b>toumingbljiao&nbsp; &nbsp; <b>时间: </b>2013-4-27 21:51<br />
1、安装象鞍<br />
2、蹑步走到大象身边（shift+w），大象会跪坐下来<br />
3、右键大象。如果你手上是大象可以吃的食物的话，会把食物喂给大象。<br />
