打开ess<br />
打开config<br />
找到<br />
ops-name-color: 'c'<br />
设置为<br />
ops-name-color: ''<br />
（留空）<br />
<div class="quote"><blockquote># OP名字的颜色代码,填写0~9或a~f其中的一个数字或字母,填写'none'来冻结该功能.(译注:可到<a href="http://ess.khhq.net/mc/" target="_blank">http://ess.khhq.net/mc/</a>查看效果)</blockquote></div><br />
