先创造一个网络，让别人加进来，开启TR，点击多人游戏，创造一个服务器，然后把蛤蟆吃启动键旁边的ip报给以及加了蛤蟆吃的人，让他们在TR里输入这个ip，就可以加服了，注意：TR版本要一样，否则加不了服。<br />
