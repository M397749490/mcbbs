<b>标题: </b>mc中都有哪些优秀的战斗技巧类mod？<br />感觉回忆一下现在还在开发以及被弃坑的mod，发觉其实mc中能够涉及到战斗技巧的mod，只有两个<br />
一个是塞尔达的剑术，一个则是双持。当然，自1.9后，双持也就没必要了。<br />
而除了这两个， 其他的涉及战斗类的mod，其实说到底就是要不然放个火雷冰，要不然就是被动加强，更高的攻击力防御力。除了这两个，总体貌似也没有什么优秀的。<br />
