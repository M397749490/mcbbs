<b>标题: </b>有没有什么插件能实现只能在指定区域开商店<br /><div align="center"><strong><font color="#ff0000">我曾经在一个服看到过&nbsp;&nbsp;在一片领地上摆了好多箱子 </font></strong></div><br />
<div align="center"><strong><font color="#ff0000">然后玩家可以花钱在这片领地上开设商店</font></strong></div><br />
<div align="center"><strong><font color="#ff0000">这要怎么实现? 是定制插件么?</font></strong></div><br />
<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>g519403080&nbsp; &nbsp; <b>时间: </b>2016-12-27 11:51<br />
1.在领地内放箱子<br />
2.站在领地内 输入/res set container t 开放容器权限<br />
3.玩家就可以开设自己商店<br />
可以定期输入/qs clean 清理库存为0的商品<br />
