打开文件<br />
\.minecraft\assets\lang\zh_CN.lang<br />
用记事本打开<br />
按Ctrl+F搜索多人游戏<br />
修改即可<br />
注意：语言文件中有多个多人游戏<br />
只有<br />
menu.multiplayer=多人游戏<br />
才是真正的单人游戏下面的多人游戏<br />
不过只有自己看得到，除非你把这个这个客户端发给别人
