神奇宝贝mod，道具栏中有一个神奇宝贝编辑器<br />
<br />
应该是一根棍子上面有个神奇宝贝球<br />
<br />
右键这个编辑器你就能打开神奇宝贝的编辑页面<br />
<br />
大小编辑非常容易，一看就懂不用多说<br />
<br />
性格你必须使用英文的性格名词才能正确变更。（建议去神奇宝贝百科对照中英文进行更改）
