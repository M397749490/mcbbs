<b>标题: </b>什么插件？<br />RT，我记得有个插件，就是输入%1%2%3到%9可以展示物品栏1~9物品的<br />
<br />
这个插件叫做什么？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>xmdhs&nbsp; &nbsp; <b>时间: </b>2019-8-21 12:43<br />

<div class="quote"><blockquote>特殊变量 %i %1-%9 只能用于聊天内容<br />

%1-9 代表快捷物品栏1-9号格子的物品<br />
比如 聊天的时候输入 大拍卖啦%i只要998之类的</blockquote></div>
