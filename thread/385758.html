<b>标题: </b>求助！！！！！<br /><font size="5">我下载了一个地图，里面有命令方块，我想把命令方块里的指令复制下来，该怎么做？</font><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>RAY5DHao&nbsp; &nbsp; <b>时间: </b>2015-1-15 19:57<br />
<i class="pstatus"> 本帖最后由 卅个屮 于 2015-1-16 17:24 编辑 </i><br />
<br />
对着命令方块Ctrl+鼠标中键就行<br />
新选中的命令方块物品放在地上就有指令<br />
如果要复制到其他软件里的话就在编辑界面按Ctrl+A和Ctrl+C<br />
然后再粘贴就行了<br />
