<b>标题: </b>求PE房子的教程<br />新手求教程，引那些人住的房子要怎么布置，要满足什么条件。还有，为什么下载下来后发现箱子挖不掉？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>MC.cdasc&nbsp; &nbsp; <b>时间: </b>2016-1-3 11:36<br />
条件<br />
1.有光（火把、灯笼、蜡烛、烛台、灯等）<br />
2.有墙（人工放置的才行）<br />
3.有门（任何材料）<br />
4.有桌子或工作台（任何材料）<br />
5.有椅子（任何材料）<br />
箱子里面有东西就挖不掉，旧版要锤子才能挖掉箱子
