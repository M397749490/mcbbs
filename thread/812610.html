<b>作者: </b>XTxiaodada&nbsp; &nbsp; <b>时间: </b>2018-8-7 17:32<br />
<b>标题: </b>关于服务器禁止跑图找铱<br />如题，服务器版本1.12，有工业2、神秘时代6，因为有神秘时代，所以不少人跑图找有箱子的宏伟树，或者找废弃矿洞里的矿车，去找铱，有什么方法能禁止箱子或矿车生成铱的吗？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>零尘233&nbsp; &nbsp; <b>时间: </b>2018-8-7 19:28<br />
在服务器根目录下的server.properties文件里有关于是否生成这类建筑的开关<br />
spawn-npcs：true<br />
改成false就能禁止生成<br />
