<b>标题: </b>请问服务器怎么设置普通玩家传送为0<br />默认为3秒，怎么弄啊？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Mieo&nbsp; &nbsp; <b>时间: </b>2015-5-6 12:29<br />
找到服务端的插件/Essentials/config<br />
找到以下文字<div class="quote"><blockquote># 传送延迟时间(以秒为单位),在玩家被确实传送之前的时间.如果玩家在该时间内移动了或者受到攻击,传送将取消.<br />
　　teleport-delay: 3</blockquote></div><br />
把后面的数字改为0即可 然后退出保存 后台打ess reload
