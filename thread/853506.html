<b>作者: </b>Zapic&nbsp; &nbsp; <b>时间: </b>2019-3-29 12:43<br />
在&quot;Askyblock/config.yml&quot;的484行<br />
<div class="blockcode"><div id="code_Xuz"><ol><li>resetinventory: true</ol></div><em onclick="copycode($('code_Xuz'));">复制代码</em></div><br />
将&quot;true&quot;改为&quot;false&quot;即可<br />
这会禁用重置岛屿和新建岛屿时的清空背包.<br />
