<hr noshade size="2" width="100%" color="#808080">

在多世界的worlds配置文件下面有这么一项！！！<br />
<br />
<div class="blockcode"><div id="code_i9t"><ol><li>&nbsp; &nbsp; playerLimit: '-1'</ol></div><em onclick="copycode($('code_i9t'));">复制代码</em></div><br />

<br />

<br />
-1代表的就是玩家的数量，-1是不限制！！！
