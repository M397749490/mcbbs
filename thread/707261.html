<b>标题: </b>如何用php做一个判断接口<br />如题，原理是php新建接口为e=，接口接受插件的email,然后在mojang服务器上请求这个邮箱绑定的正版用户名，如果没有的话返回!none!，求源代码，做正版认证用。调用例子：<a href="http://www.xxx.com/xxx.php?e=xxx" target="_blank">www.xxx.com/xxx.php?e=xxx</a>@xxx.com<br />
返回例子：Zi_Min<br />
无正版返回：!none!<br />
