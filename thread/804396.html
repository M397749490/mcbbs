<b>标题: </b>关于ils插件的职业lore问题<br />我在添加lore后，该职业lore的限制效果只对原版伤害有效，并不能对ils本身的属性，如攻击力，PVE伤害有效。<br />
比如说我加上了职业lore的狂战士，我用原版钻石剑只能打2伤害，但是加了PVE伤害后，就能打出加了的pve伤害<br />
<br />
[职业配置中加入了狂战士，职业的lore也确实起作用了，但是限制不住它自己的属性。。。]<br />
