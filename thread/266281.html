你指的是蒸汽机车吗？要加燃料（煤、煤焦）和水（用桶），然后点运行，选择档位，之后稍等一会，就可以开动了。<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>天12&nbsp; &nbsp; <b>时间: </b>2014-4-19 20:08<br />
拿煤炭对火车按鼠标右键，在空手对火车按鼠标右键，做上去之后按R键即可开火车
