<b>标题: </b>关于TD热力管道<br />请问热力管道的旅行管道怎么用？<br />
<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Tollainmear&nbsp; &nbsp; <b>时间: </b>2018-6-10 13:49<br />
你需要使用旅行管道搭建一个管道，然后使用新月锤右键后，封闭的管道打开，成为路径点。右键编辑路径点名称/用一个物品标记。当一段管道中有两个路径点时，右键路径点，单击选择目的地，即可旅行。<br />
<br />
按shift可以中途出来。<br />
注意：你最好全部使用旅行管道，而不是远程旅行管道或者旅行链接管道，另外<br />
卡洛兰想念你
