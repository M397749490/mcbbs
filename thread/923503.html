可能是地图支持的版本不同 以后导入地图这样操作<br />
1.先/mv create创建地图<br />
2.关闭服务器 将创建地图文件的regin文件夹删除 一定要删除 不要覆盖<br />
3.把要导入的地图的regin拖进创建地图的文件夹内<br />
4.启动服务器 /mv tp 即可<br />
<br />
这样导入的地图比mv import要稳定 不会崩溃
