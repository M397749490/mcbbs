<b>标题: </b>1.10.2 盖亚魔典3不刷怪<br /><p style="line-height:30px;text-indent:nullem;text-align:left"><font style="color:rgb(51, 51, 51)"><font face="&amp;quot"><font style="font-size:12px">1.10.2生存模式突然就不刷盖亚的怪了</font></font></font></p><p style="line-height:30px;text-indent:nullem;text-align:left"><font style="color:rgb(51, 51, 51)"><font face="&amp;quot"><font style="font-size:12px">能进游戏..也可以用盖亚3的刷怪蛋把怪刷出来..但无法自然生成mod里的怪</font></font></font></p><p style="line-height:30px;text-indent:nullem;text-align:left"><font style="color:rgb(51, 51, 51)"><font face="&amp;quot"><font style="font-size:12px">只装这一个mod也是这样..重装游戏也没用</font></font></font></p><p style="line-height:30px;text-indent:nullem;text-align:left"><font style="color:rgb(51, 51, 51)"><font face="&amp;quot"><font style="font-size:12px">有没有大佬知道怎么回事啊</font></font></font></p><p style="line-height:30px;text-indent:nullem;text-align:left"><font style="color:rgb(51, 51, 51)"><font face="&amp;quot"><font style="font-size:12px">一直以来都玩得好好的突然就不刷怪了..也没弄其他什么东西..关键是单独装它一个mod都不刷怪(我肯定不是开的和平</font></font></font></p><p style="line-height:30px;text-indent:nullem;text-align:left"><font style="color:rgb(51, 51, 51)"><font face="&amp;quot"><font style="font-size:12px">forge版本 12.18.3.2511</font></font></font></p><p style="line-height:30px;text-indent:nullem;text-align:left"><font style="color:rgb(51, 51, 51)"><font face="&amp;quot"><font style="font-size:12px">mod版本 1.10.2-1.5.6</font></font></font></p><br />
