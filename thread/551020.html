<b>标题: </b>BC进入子服IP显示127.0.0.1<br />如题，我用了BungeeCord。<br />
分了两个子服务器，1号为A1，2号为A2.<br />
设置好了Spigot端开启bungeecord: true<br />
BC端也设置了ip_forward：true<br />
那么问题来了。<br />
进入登陆服的时候IP正常显示。<br />
从登陆付进入到2号服务器的时候IP会显示127.0.0.1<br />
