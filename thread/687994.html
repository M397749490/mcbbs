<b>标题: </b>求助<br /><font size="4">我需要把服务端的登录插件保留，再把玩家的登录信息替换到另一个服务端里改该怎么做？</font><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>浅念哥&nbsp; &nbsp; <b>时间: </b>2017-4-22 14:31<br />
很简单，首先确定两个服务端的登陆插件是相同的，不相同的话很麻烦。<br />
plugins\AuthMe\auths.db文件，直接复制到你要替换的服务端同目录即可<br />
auths.db就是所有玩家的登陆数据<br />
注意关服操作，替换后开服即可<br />
注：这样操作被替换的服务器原来的登陆数据都会不见
