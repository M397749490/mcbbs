<b>作者: </b>xRPQx&nbsp; &nbsp; <b>时间: </b>2015-12-27 10:15<br />

打开config<br />
搜索&nbsp; &nbsp; maxRegPerIp<br />
设置即可<br />
<br />
如<br />
<font color="Red">&nbsp; &nbsp; maxRegPerIp: 3</font><br />
<br />
就是一个ip最大可注册3个<br />
求最佳
