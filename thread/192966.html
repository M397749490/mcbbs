<b>标题: </b>我的世界中世纪mod怎么把印度雕像卖给印度<br /><hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>werewolf123&nbsp; &nbsp; <b>时间: </b>2013-11-6 14:28<br />
1、进入宫殿<br />
2、等待着你的NPC，和他交易（头上有字）<br />
3、进入交易界面后有三排，第一排是NPC的售卖，第二排是NPC收购的东西，第三排是你的物品。<br />
4、进入交易界面后，在第一排左键是买一个，右键是买八个。第二排是是卖，方法和第一排一样。第三排不用理。<br />
5、右击或左击中间那排的雕像，就卖掉了。
