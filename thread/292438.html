开服用的不是插件，而一般是批处理命令，从网下下载一个懒人包，然后把服务器IP设置成你自己的（外网IP，如有内网填内网IP），把端口改成你需要的（比如25565【有内网则需要端口映射，端口映射的端口为之前设置的<a href="http://jingyan.baidu.com/article/1709ad80d599d24634c4f0c2.html" target="_blank">{点我学习端口映射}</a>】），然后再打开服务器的批处理文件即可开服
