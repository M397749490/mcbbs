<b>标题: </b>多年萌新导报<br />完了好几年mc了。断断续续得有块七八年了。最近又迷上了神奇宝贝。发现跟前两年的完全不一样。那会还全是棱角。蹲个路卡利欧跟快龙就能兴奋一晚上。真的比那会的什么白金钻石什么的抓到神兽还高兴。虽然那会就没抓过几只。但是先在1.12.2的服，最新神奇宝贝啥都有。好像原版神奇宝贝有的mc神奇宝贝都有。做工真**精美。期待一下神奇宝贝即将要出的剑盾。还有mc的更新。顺便问问有没有小伙伴一块玩~我新开了一个神奇宝贝的服务器。在最后的调试阶段~~~<br />
