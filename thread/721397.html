<b>标题: </b>建议加强提升卡限制<br />最近有一些腐竹 为了服务器热度更高就鼓励玩家来论坛购买提升卡顶帖 然后获得奖励 成为了论坛的另一大无脑水贴的来源 就算水到了能用提升卡的等级也会继续水 因为每天只有40金粒 造成很多人每日一水主题或多张水楼无图 所以建议把使用提升要求提高到6级 还有将水主题的惩罚从删帖提高到发卡或扣人气<br />
