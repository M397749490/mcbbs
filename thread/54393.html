换图的话打开server.properties把level-name=world中的world改一下，启动服务器会生成新的文件夹，名字是你改的名字。安装mod的话要先在server.jar里搞上forge，运行服务器会生成mods文件夹，把需求forge的mod放进mods里解不解压没关系。
