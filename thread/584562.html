<b>标题: </b>服务器<br />怎么把服务器标语旁边的那挂一张图片跟其他服务器一样<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>lichi2050&nbsp; &nbsp; <b>时间: </b>2016-5-16 13:10<br />
首先最低需要的版本是1.7 否则没办法<br />
1. 准备图片，必须为 64 x 64 <br />
2. 编辑图片名称改成 &quot;server-icon&quot; 换成 .png 格式.<br />
3. 扔到服务器文件夹（主文件夹就行，就是核心和世界文件夹相同的文件夹）<br />
4. 重启服务器
