<b>标题: </b>怎么禁用已经安装过的MOD？？？<br />内卫知道的教我一下哈~<br />
好像是用ModlLoader.<br />
<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>路邊電燈泡&nbsp; &nbsp; <b>时间: </b>2012-2-15 20:50<br />
開始--&gt;運行--&gt;打上%appdata%--&gt;開啟.minecraft文件夾--&gt;開啟config文件夾--&gt;開啟ModLoader.cfg(以記事本開啟)--&gt;找到想關閉的Mod--&gt;將後面的on改為off(on是開啟此Mod，off是關閉此Mod)
