<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>renyunzhong&nbsp; &nbsp; <b>时间: </b>2020-7-22 18:50<br />
打开.minecraft/config/ModernWarfare.cfg（记事本即可），找到knockbackOnHit=&quot;true&quot; 改成 knockbackOnHit=&quot;false&quot; 即可，这个是是否开启击退的选项，关闭就什么击退都没有了
