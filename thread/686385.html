<b>标题: </b>mcmmo挖矿<br />怎么让挖矿不双倍掉落<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>浅念哥&nbsp; &nbsp; <b>时间: </b>2017-4-13 18:17<br />
mcmmo -&gt; config.yml<br />
搜索Double_Drops<br />
Herbalism，Mining，Woodcutting分别对应泥土类，矿物类，木类<br />
要想挖矿不双倍掉落将Mining下的所有方块设置为false即可<br />
重启服务器即可生效
