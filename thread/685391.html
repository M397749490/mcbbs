首先活塞收南瓜我想LZ应该会把?<br />
在南瓜周围的空路上铺上铁轨记得隔6段就放一个动能铁轨动能铁轨要激活<br />
然后铁路做成循环的放上漏斗矿车开始循环，<br />
全自动的话就在铁路的某一段替换成探测铁轨 漏斗矿车过去就会激活活塞从而自动收割南瓜西瓜等农作物<br />
然后记得随便选一块铁轨下放漏斗这样就能全自动收农作物啦~
