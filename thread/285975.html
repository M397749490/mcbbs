还是帮楼主总结一下皮肤的分类<br />
原创：纯属自己制作的皮肤<br />
半原创：用别人的作品更改后完成的皮肤(以各种动漫形象为素材做皮肤算作原创)<br />
转载：纯别人的作品<br />
转载和半原创需经原作者同意并贴出原帖地址
