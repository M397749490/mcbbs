<b>标题: </b>求一个没有方块的世界的种子<br />求一个没有方块的世界的种子！<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>BensonQC&nbsp; &nbsp; <b>时间: </b>2014-8-7 14:04<br />
用超平坦预设。<br />
把世界类型调到超平坦，点击个性化，将下面的代码复制进去。<br />
<div class="blockcode"><div id="code_TLZ"><ol><li>2;0x0;1</ol></div><em onclick="copycode($('code_TLZ'));">复制代码</em></div><br />
这样整个世界就是一片虚空，世界生成后，马上飞起来，用setblock命令在一个坐标放置一个方块，然后用tp命令瞬移到那个坐标，就可以了。
