<b>标题: </b>教你在局域网内禁用某物品！-纯文字<br />首先你需要输入/give @p 137 1，得到一个命令方块.然后放在地上[废话- -]右键点击开命令方块的界面之后在控制台指令框输入/clear @a 需要禁止掉的物品id 比如/clear @a 46 这样就可以让其他人不能用TNT了[包括你自己]<br />
还有最后一步，你需要做一个循环红石电路.不停的给命令方块电源，让他重复执行这个命令.频率越快越好<br />
[End]<br />
