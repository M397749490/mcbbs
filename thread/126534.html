<b>标题: </b>求助魔戒MOD的问题<br />请问魔戒MOD传送门怎么做？<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>马赛克了&nbsp; &nbsp; <b>时间: </b>2013-6-5 23:21<br />
8个金粒合成一个金指环，金指环丢火里，Q丢弃，火可以用打火石生成一团，丢进去发生爆炸，出现传送门，是个大戒指，然后要到达戒指的高度，方可传送。注意，只能开一个这样的传送门，所以选好地址
