<b>标题: </b>跳转回复链接<br />&nbsp;&nbsp;如何在帖子里设置跳转到别人回复的链接？<br />
&nbsp;&nbsp;就是一点击，就跳转到另一个人的回复<br />
比如这个<br />
<a href="http://www.mcbbs.net/forum.php?mod=redirect&amp;goto=findpost&amp;ptid=388581&amp;pid=7538979" target="_blank"><font size="3">第二章 生物群系</font></a><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>andylizi&nbsp; &nbsp; <b>时间: </b>2015-6-25 11:19<br />
先在&quot;电梯直达&quot;那个文本框里输入你想要链接到的楼层<br />
然后按那个电梯的图标，就像这样(比如我想弄第12楼的链接)↓<br />
<img id="aimg_fj8h1" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" src="http://i1.tietuku.com/398640b7cd51b139.png" onmouseover="img_onmouseoverfunc(this)" onload="thumbImg(this)" border="0" alt="" /><br />
然后点了以后，你的浏览器就会跳转到另一个链接去。这个时候，把地址栏里的链接复制下来，就好了。<br />
<img id="aimg_G8YIp" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" src="http://i1.tietuku.com/f760408091fc2314.png" onmouseover="img_onmouseoverfunc(this)" onload="thumbImg(this)" border="0" alt="" /><br />
<br />
然后就把那个链接粘贴到新的标签页试试看吧！~<br />
