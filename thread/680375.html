<b>标题: </b>关于mod教程版的审核问题<br />我看教程版的工业教程少，而且还有些过期的，我打算发新的教程，每天更新一部分，我发一次要等一天多才审核过而且还私聊n位版主，与其这样能否改进审核方式或者取消审核？不然mod教程版还是会不景气，打消积极性。<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>混乱&nbsp; &nbsp; <b>时间: </b>2017-3-13 14:21<br />
版主只有业余时间能够对板块进行管理，文字量大的情况，很难规避审核词，建议你在写教程的时候使用pdf文档等方式，就可以绕过审核词了。
