<b>标题: </b>怎么取消某个玩家的白名单？<br />/whitelist add xxx是添加白名单<br />
但是我现在想把xxx从白名单里剔除，要输入什么呢？<br />
= =、之前找到过的，后来忘了<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>黄凯航&nbsp; &nbsp; <b>时间: </b>2012-11-3 02:00<br />
有两种方法：<br />
1./whitelist remove &lt;玩家名字&gt;<br />
2.直接从服务器文件夹里的whitelist.txt里删除你想要移出白名单的玩家名字<br />
设定为最佳答案吧=w=
