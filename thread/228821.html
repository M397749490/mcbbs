<b>作者: </b>miminiao&nbsp; &nbsp; <b>时间: </b>2014-1-29 20:14<br />
如果是自己控制的村庄，就直接右击“军事”的牌子，从里面选择对哪个村庄发动战争，等一段时间以后有战斗力的村民就会去进攻<br />
如果不是自己控制的村庄，就使劲诋毁另一个村庄，到-100的时候就有几率自动策划战争<br />
至于战争怎么打能不能打赢又是更复杂的问题了~<hr noshade size="2" width="100%" color="#808080">
