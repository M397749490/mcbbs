<b>标题: </b>我也来带一句诗<br /><div align="center"><font size="3">这里的带诗人真的太多了，质量也有好有坏，但是他们最终的目的不都是活跃一下吗？</font></div><br />
<div align="center"><font size="3">那，我也来尝试带一句诗：</font></div><br />
<div align="center"><font size="6"><font color="#0000ff">一纸书来只为墙，</font></font></div><br />
<div align="center"><font size="6"><font color="#0000ff">逃他十六又何妨。</font></font></div><br />
<div align="center"><font size="6"><font color="#0000ff">嘶嘶响声今犹在，</font></font></div><br />
<div align="center"><font size="6"><font color="#0000ff">不见当年苦力怕。</font></font></div><br />
<div align="center"><font size="2"><font color="#000000">哈哈哈，第一次带诗，质量不好请见谅</font></font></div><br />
