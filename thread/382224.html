<b>标题: </b>怎么设置一个权限组的玩家能领到多块地皮？<br />版本[172]用的是<font size="4">plotme</font>地皮插件。<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>网络摆渡客&nbsp; &nbsp; <b>时间: </b>2015-1-5 20:36<br />
给相应组这个权限：plotme.limit.x<br />
指令为：/mangaddp 用户组名 plotme.limit.x<br />
上面提到的x是数字，如果将x设为1就是领一块，设为3就是领三块，设为5就会领5块
