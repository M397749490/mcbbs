<b>作者: </b>rxffr&nbsp; &nbsp; <b>时间: </b>2015-1-30 14:17<br />
插件权限<br />
=== 权限 ===<br />
* dexp.admin&nbsp;&nbsp;可以设置多倍经验活动的权限<br />
* dexp.vip 永久多倍经验的权限<br />
=== 方法 ===<br />
/dexp setserver [倍数] [时长]&nbsp; &nbsp;&nbsp; &nbsp;&nbsp;&nbsp;留空则默认双倍一小时<br />
=== 例子===<br />
/dexp setserver 2 <br />
就是2倍经验一小时
