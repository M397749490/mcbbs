<b>作者: </b>1197182470&nbsp; &nbsp; <b>时间: </b>2016-3-12 22:48<br />
<b>标题: </b>怎么给默认权限组help权限<br />服务器不知道怎么回事不能输入HELP啦 玩家是权限不足<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>速升轩&nbsp; &nbsp; <b>时间: </b>2016-3-12 22:48<br />
首先得有ESS基础插件以及ESS的GM权限组插件<br />
然后在客户端输入以下内容<br />
/mangaddp Default essentials.help<br />
或者<br />
/mangaddp Builder essentials.help<br />
一般来说这个权限默认是有的
