<b>标题: </b>怎么在服务器设置自己的血量<br />用插件不小心把血量弄成14了，怎么调回20HP<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>西瓜太郎&nbsp; &nbsp; <b>时间: </b>2017-2-23 07:47<br />
请说明插件名称，能调少就一定能调回去<br />
如果楼主用的是SimpleHP，输入/simplehp set XXX 20<br />
XXX是玩家的游戏ID，如果血量不是20，可以把数字改为40再试试（以2倍计算）
