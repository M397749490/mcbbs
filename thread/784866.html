本身末影珍珠和放物品在奥术基座都是右击，应该是没有插件吧<br />
但是有解决方法：<br />
- 让玩家对着要放末影珍珠的基座放一个漏斗，然后放末影珍珠在漏斗里面，可以自动弄到基座上[或者模组的管道都是能接在基座上的]
