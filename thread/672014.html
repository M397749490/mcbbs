<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>MC_kemi&nbsp; &nbsp; <b>时间: </b>2017-2-7 23:21<br />
/ps trust 名字 将这玩家永久给你地皮权限<br />
/ps add 名字 给玩家单次地皮建筑权限 你一下线权限就消失<br />
<br />
用p add重启后权限就会消，请仔细阅读搬运贴内容，这个指令是有改动的。
