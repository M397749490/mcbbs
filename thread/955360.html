<b>标题: </b>就随随便便发个几个文案<br />“其实男孩子啊，你越懂他，他就越温柔，你越理解他的不容易，他就越拼命，你对他好，他无论如何也不会让你输的”<br />
民谣很文艺，可小酒馆里的酒并不便宜，就像是，我们稍不努力，连情怀都买不起<br />
她说民谣太穷了，一听就是一根烟，一听就是一瓶酒。而我只有一根烟了，还要撑一夜，只剩一点爱了，还要过一生。那时我们有梦,关于文学,关于爱情，关于穿越世界的旅行。<br />
这世界上的久处不厌都是因为用心<br />
等哪天有一个女孩子愿意为我低头，我一定会奋不顾身的爱她<br />
