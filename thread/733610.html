<b>标题: </b>每次游戏一定时间以后都会出现内存溢出？<br />我主要玩的是整合包，都是100左右的mod，太多电脑带不动，太少又没啥可玩的<br />
最近发现内存溢出卡顿现象严重，正常游戏时FPS一般在30-60之间基本上维持在4.50左右<br />
主要是发展前期每次玩到4小时以上接近5小时后会出现内存溢出现象<br />
发展后期一般是玩接近3小时会出现内存溢出情况<br />
虽然重启一下游戏，就会好，但还是感觉很不爽啊<br />
有没有啥比较好的办法<br />
