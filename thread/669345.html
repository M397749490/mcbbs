<b>标题: </b>来一个会建筑的<br />首先要熟练掌握各种方块的特性和搭配。如栅栏、地毯、半砖等。<br />
其次还要对建筑了解，熟知各种结构的作用，像最基础的L形、凹字形都是要知道的。还得掌握房屋内饰的方法，与外墙的装饰和建筑的布局。<br />
到了后期还得形成自己的风格，不能与他人的建筑过分相似。如果可以的话还可以学习下命令方块的运用，并且会用we之类的辅助软件帮助你制作建筑。<br />
<br />
