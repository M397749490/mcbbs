你打开“选项 - 控制”，看看是否存在按键冲突。<br />
<br />
就像这样：<br />
<img id="aimg_L50uB" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" src="https://ooo.0o0.ooo/2016/07/24/579464502630f.png" onmouseover="img_onmouseoverfunc(this)" onload="thumbImg(this)" border="0" alt="" /><br />
<br />
字是白色说明不存在冲突，字是红色代表该按键冲突了。你主要看的是“K”，若K是红色，那就重设一下。
