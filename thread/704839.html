<b>标题: </b>chest钟表插件的问题<br />请问我设置了2个钟表插件而且都有用指令打开和右键物品打开的 但是当我想把2个菜单联系在一起的时候就是一个主菜单一个子菜单的时候发现没有用安装到服务器要么是子菜单显示要么是主菜单显示求教急<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>wunan84&nbsp; &nbsp; <b>时间: </b>2017-7-9 21:47<br />
2个菜单不能用同一个指令或者物品来打开。<br />
如果打开子菜单有2种办法<br />
1、设置其他打开指令和物品<br />
2、在主菜单设置打开子菜单的按钮图标
