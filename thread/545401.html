<b>标题: </b>闲聊<br />我离开论坛有一段时间了，主要是发现，最近一段的时间，MC变得更方便玩了，但是真的方便了吗？有一个软件，自动装mod，自动装什么的，真的是方便了吗？只能说是引入了大批的小学生，现在，在某版里面，总能发现有一些MCBBS新人在抄袭得人气，我觉得还管得不够严，虽然惩罚重了，但是新人并不知道太多，很少有新人点入版规的帖子，现在回来，找也找不到算是很多的精致的内容，虽然质量比以前好了，但是少，我想MCBBS的人才应该多一些才算是好，看见低质量、抄袭的帖子我也是心痛了。<br />
