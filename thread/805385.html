<b>标题: </b>1.11.2的地狱顶端双向传送门被修了吗？<br />我在网易mc和基友联机发现，主世界的地狱门不往地狱顶端链接了。<br />
我已经在地狱顶造好了传送门，能从地狱回到主世界指定的位置，但是主世界就上不了地狱顶，每次都是在层数比较低的地方重新生成一个地狱门。地狱顶部的传送门坐标是没有问题的，我也试过顶着地狱顶层基岩放传送门也能做到双向传送。<br />
请问这是哪个版本更新以后地狱顶端的双向门就不能用了吗？还是有什么特殊的操作？<br />
