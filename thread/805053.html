<b>作者: </b>shenglong圣龙&nbsp; &nbsp; <b>时间: </b>2018-7-11 19:48<br />
<b>标题: </b>ASkyBlock空岛插件的地狱问题<br />所有的空岛都连接着一个地狱。【地狱空岛的只有两个平台】导致有些玩家在第二个平台也就是刷怪区域圈地，而第一个平台岛屿保护不能破坏，玩家不能拆上面的地狱疣，求解。怎么让每个空岛有自己的地狱空岛，然而第一个空岛的岛屿保护去掉。<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>叽叽小石头&nbsp; &nbsp; <b>时间: </b>2018-7-11 19:48<br />
打开空岛config找到 newnether:设置为true<br />
删除原来的地狱世界<br />
重启就完事了
<br /><br /><br /><br /><hr noshade size="2" width="100%" color="BORDERCOLOR">
