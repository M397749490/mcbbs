<b>作者: </b>会跑的房子&nbsp; &nbsp; <b>时间: </b>2013-7-27 09:37<br />
在服务端里的config文件夹&nbsp;&nbsp;有&nbsp; &nbsp;&nbsp;&nbsp;IC2文件&nbsp;&nbsp;打开&nbsp;&nbsp;<br />
<br />
找到：enableWorldGenOreCopper<br />
enableWorldGenOreTin<br />
enableWorldGenOreUranium<br />
把他们后面的=都改成true<br />
就可以了
