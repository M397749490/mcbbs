貌似是显卡的问题...<br />
如果出现闪烁或者透明方块<br />
1. 禁用“线程优化”/“OpenGL的执行绪” （在显卡控制面板） <br />
2. 启用的图形控制面板“中的”垂直同步“选项的性能或设置垂直同步。 <br />
