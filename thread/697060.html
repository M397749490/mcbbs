<b>标题: </b>服务器不会换地图<br />我在鬼鬼百货那租了个服务器，现在我想将原本的普通世界换别的地图 求解答该怎么办（ps：因本人比较蠢 所以希望最好可以远程操控一下）<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>xu11xx&nbsp; &nbsp; <b>时间: </b>2017-6-9 00:24<br />
最无脑的办法：<br />
<br />
0.关闭服务器<br />
1.删掉根目录下的world文件夹<br />
2.把你的地图拖入根目录<br />
3.将你的地图更名为world<br />
4.开启服务器<br />
<br />
有能力的话可以安装个多世界插件。<br />
详细我就不多展开了
