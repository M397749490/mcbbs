<b>标题: </b>经验值限制<br />怎么做到经验值限制，高于XXX等级就不能怎么样，低于，就可以触发机关<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>阴阳师元素祭祀&nbsp; &nbsp; <b>时间: </b>2017-1-16 19:20<br />
<br />
&nbsp; &nbsp; [l=L] — 只选择不超过 L 经验等级的目标。<br />
<br />
&nbsp; &nbsp; [lm=LM] – 只选择不低于 LM 经验等级的目标。 <br />
<br />
@a[l=2]<br />
选择经验等级不超过2的人<br />
比如<br />
give @a[l=2] stone<br />
给经验等级不超过2的人一个石头
