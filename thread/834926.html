<b>标题: </b>服务器BC问题<br />新的玩家进入是登录服但第2玩家进入的服务器是上一次所在的服务器怎么办<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>恋&nbsp; &nbsp; <b>时间: </b>2018-12-21 08:58<br />
把BC配置的&nbsp;&nbsp;force_default_server: true 打开<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>贺兰兰&nbsp; &nbsp; <b>时间: </b>2018-12-23 12:56<br />

force_default_server: <br />
将false改成true即可
