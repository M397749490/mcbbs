<b>标题: </b>[原创/单篇]长城<br />[ 本帖最后由 散秋polar 于 2018-7-7 18:15 编辑 ]\n\n原创诗[长城]——不舍昼夜，两千年的坚守<br />
<br />
在地平线之末端，<br />
巨石砌成的千年史诗。<br />
呐喊，<br />
击碎了沧穹的暗影。<br />
长城屹立，<br />
直至永生。<br />
易朽之磐石，<br />
十四万万龙之圣子的信仰不灭！<br />
我们流淌着黄河之血，<br />
九州一统，<br />
莫邪之刃干将之锋我携万里长城，<br />
笑天下逆我沧生！<br />
七十万个昼夜，<br />
长城不朽......<br />
