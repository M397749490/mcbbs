<b>作者: </b>1204074991&nbsp; &nbsp; <b>时间: </b>2016-5-10 12:44<br />
圈地默认都是禁止的<br />
如果不是<br />
输入<br />
/res set 领地名 piston false<br />
或站在领地内输入<br />
/res set piston false
