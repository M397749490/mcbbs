<b>标题: </b>Galacticraft星系里的星球会刷新<br /><div align="center"><font face="微软雅黑"><font size="5">最近玩了一个服务器</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">有星系mod</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">我上了月球之后发现领地啊，home点啊都会自己消失掉</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">服主说会刷新</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">甚至连设置好的死亡不掉落指令都会刷新掉</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">所以月球等星球就变成了熊孩子杀人掠夺的地方</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">但是地图文件不会消失</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">而且似乎陨石的掉落率也有点问题？</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">我在月球逛了3个多小时都没见到过一次</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">不管是挂机等，开着载具去跑图都找不到</font></font></div><br />
<div align="center"><font face="微软雅黑"><font size="5">我代服主问一下，看有没有解决办法</font></font></div><br />
