<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>miejun&nbsp; &nbsp; <b>时间: </b>2016-5-3 18:07<br />
这个是类似于圈地的范围<br />
一旦出了这个范围<br />
就无法对方块进行更改<br />
而盔甲架就算超出地皮位置也不能玩家再行修改<br />
可以清楚掉全部的盔甲架<br />
或者在地皮世界禁止盔甲架使用<br />
在其他世界<br />
这应该是地皮插件的bug<br />
暂时没有更好的修复办法
