<b>标题: </b>怎么让玩家完成新手教程后才会拥有权限<br />就是让玩家刚进服务器没有任何权限，必须做新手任务，等做完了新手任务才能进入默认权限组（我用的cmi）<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>叽叽小石头&nbsp; &nbsp; <b>时间: </b>2018-12-17 09:15<br />
权限组插件默认权限组设置一个没有权限的。任何一个任务插件(自行搜索插件&amp;教程)做一个任务，奖励一个指令切换到基础权限组
