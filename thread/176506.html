<b>标题: </b>竞技场的职业怎么设置<br />我找到个竞技场插件，看别人的视频有一种就是打1下木牌就有东西的牌子怎么设置&nbsp; &nbsp;木牌职业<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>qq790716365&nbsp; &nbsp; <b>时间: </b>2013-9-22 17:19<br />
你先把插件放进服务端，然后关服，然后到服务端里面的Plugins里面有一个和你插件一样的文件，打开他，然后打开Classes.yml文件，看看里面的职业名是啥，之后再进游戏，把你看到的职业名打在牌子上就可以了。
