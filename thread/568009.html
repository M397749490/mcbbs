<b>标题: </b>setblock 如何放置整个木门<br />用 setblock 放置 ID为64 的门总是半个，用ID324 就显示不存在这个物品，请问如何用setblock放置整个门<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>⊙v⊙&nbsp; &nbsp; <b>时间: </b>2016-3-19 10:33<br />
/setblock ~ ~ ~1 wooden_door<br />
/setblock ~ ~1 ~1 wooden_door 8<br />
<br />
分两半的说，先是下半，再来是上半。<br />
或者你可以用/clone，那样会更简单。
