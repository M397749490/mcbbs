<b>标题: </b>脚本方块问题<br />怎么用脚本方块弄&nbsp; &nbsp;&nbsp; &nbsp;玩家右键牌子，扣除萝卜x64然后执行一个命令（要扣除了萝卜才能执行的那种，不然会直接执行命令，没萝卜也行）<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>筒子&nbsp; &nbsp; <b>时间: </b>2014-12-5 19:48<br />
<font color="Red">/sbinteract create [$item:391 64][@bypass /manuaddv &lt;player&gt; prefix 勤恳的老农]</font><br />
这个就是右键牌子收取64个萝卜<br />
然后给予称号<font color="Lime">勤恳的老农</font>
