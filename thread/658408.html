<b>标题: </b>服务器经常无法ping通，但是多试几次能进去<br />1.7.2spigot服务器<br />
同一个独立服务器上开了两个服务端<br />
都是使用的域名解析<br />
经常会出现，一个很快就能刷出motd来，另一个就一直显示Pinging中，刷不出来<br />
直接点那个ping中的服务器也会卡登陆中的，但是多试几次的话就能进去<br />
进去以后就不会卡<br />
那个能刷出来的服务器进去也不会卡<br />
只是偶尔出现这种情况，一般都是周末<br />
平时都很正常<br />
两个服务端插件几乎一模一样
