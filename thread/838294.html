服务器内，手中拿着某些物品对着方块左键一下，材质就会丢失（变成黑紫相间的方块），其原因是左键一下这个物品的useddata会变成0，比如quartz左键一下会变成quartz useddata:0，不知道是什么东西的问题，求助大佬们。<br />
