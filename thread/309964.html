请问，地皮插件怎么设置玩家占领地皮块数限制！<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>shuaohao38&nbsp; &nbsp; <b>时间: </b>2014-7-28 15:31<br />
/mangaddp default plotme.limit.x[X可以改变为任何数量，X改成什么数，那么玩家就可以有几个地皮]<br />
比如要玩家拥有两个地皮，那么用/mangaddp default plotme.limit.2 即可
