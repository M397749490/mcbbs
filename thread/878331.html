<b>标题: </b>如何监听箭射到了方块<br />如题，如何监听箭射到了方块(1.8的api，ProjectileHitEvent还没有getHitBlock)<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>lgou2w&nbsp; &nbsp; <b>时间: </b>2019-6-28 21:38<br />
在NMS底层中撞击到实体和方块会触发，此时获取弹丸的位置 ProjectileHitEvent.getEntity().getLocation() 就是撞击到的位置。之后通过 Location.getBlock() 就得到撞击的方块了。
