如果LZ没装格雷，用IC精炼铁在工作台围一圈8个就可以了<br />
如果转了坑爹的格雷，需要用精炼铁板在工作台围一圈8个就可以了<br />
精炼铁板初期可以用大锤，在合成台里合成，2精炼铁+1锤子就可以了<br />
中后期可以用压板机，只要1个对应的锭就可以出1个对应的板
