<b>标题: </b>BetonQuests的问题<br />如图，现在我想击杀两种怪物，如何做到？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>叽叽小石头&nbsp; &nbsp; <b>时间: </b>2018-7-12 15:58<br />
你得做一个事件。执行三个目标设置一个总目标两个怪物的两个目标。完成之后执行标签事件。给总目标加上两个目标所获得的标签的条件，总目标执行一下完成任务日志即可
