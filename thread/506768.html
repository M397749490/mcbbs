<b>作者: </b>snowclay&nbsp; &nbsp; <b>时间: </b>2015-9-29 22:21<br />
<b>标题: </b>对论坛细节的一点小建议<br /><i class="pstatus"> 本帖最后由 snowclay 于 2015-9-29 22:27 编辑 </i><br />
<br />
论坛每当有人回帖时，在右上角会有一个红石火把在闪烁，<br />
而且显示提醒的数量，这个功能很方便<br />
而论坛有人私信消息时，只会显示一本附魔书，而没有数量显示<br />
因此经常忽略消息，希望消息也可以加一个数量显示<br />
这样就可以及时发现有人私信了自己，即时回复。<br />
这是我的一点小建议，不知道能不能实现。<br />
祝MCBBS越办越好。
