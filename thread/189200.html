<b>标题: </b>神秘时代3专家法杖<br />问一下大家，神秘时代3的专家法杖怎么做。我把神秘统一场论研究出来后，按照魔导手册上的合成表在奥术工作台上做不出来，学徒之杖的魔力也是满的，究竟是怎么回事啊？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>restartmin&nbsp; &nbsp; <b>时间: </b>2013-10-27 08:57<br />
研究手册，神秘方块那里，点开，有一种2*2的合成台<br />
这种合成台旁边要放一个神秘坩埚，根据合成要求，在坩埚里溶解对应的元素
