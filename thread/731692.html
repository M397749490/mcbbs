<b>作者: </b>MC龙神&nbsp; &nbsp; <b>时间: </b>2017-10-6 13:20<br />
<b>标题: </b>论网易服务器如何加辅助mod(不是作弊mod)<br />1.找到网易启动器文件夹(一般在c盘)<br />
<br />
2.打开MCLDownload文件夹<br />
3.打开game文件夹<br />
4.打开你邮箱账号名字<br />
5.打开NETGAME文件夹<br />
6.打开客户端的文件夹<br />
7.打开.minecraft文件夹<br />
8.打开mods文件夹<br />
9.安装mod 运行游戏<br />
<br />
注：此方法只是用来安装辅助mod，如：key 等 如安装作弊mod 本人概不负责<br />
