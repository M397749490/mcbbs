<b>标题: </b>怎么创建不同的shopkeepers<br />除了输入/shopkeepers指令以外的村民 怎么用shopkeepers弄出女巫或者狼 JJ怪这样像村民可以一样交易的指令？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>余思思&nbsp; &nbsp; <b>时间: </b>2015-1-30 12:16<br />
到这里：<a href="http://dev.bukkit.org/bukkit-plugins/shopkeepers/files/" target="_blank">下载符合服务器版本的最新版村民商店插件</a><br />
然后在游戏里输入：/shopkeepers &lt;生物名称&gt;&nbsp;&nbsp;即可生成对应的生物模型商店<br />
有些生物是无法生成为商店，请见谅！<br />
