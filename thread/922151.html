<b>标题: </b>生存服玩建筑<br />在硬核生存服里，玩建筑，是什么体验。<br />
硬核主要指饥饿改革，调味料。并且BAN掉了类似植物魔法的禁忌之果和工业的锡罐，另外就是生成各类矿物的概率减小。<br />
但这么一想，好像也不怎么影响建筑，特别是中式，只需要木头和石头。
