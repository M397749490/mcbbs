<b>标题: </b>关于附魔概率<br />我在服务器中使用了更多附魔Mod,但这个mod有些属性过于变态，如何更改单个附魔属性的附魔几率<br />
<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>xmdhs&nbsp; &nbsp; <b>时间: </b>2019-12-22 00:36<br />
你说的是 1.7.10 的 MoreEnchantments 吗<br />
<br />
不可以调节概率，但是能禁用附魔和设置附魔的最高等级<br />
<br />
编辑位于 .minecraft\config\MoreEnchantments\ 中的 Core.cfg 即可
