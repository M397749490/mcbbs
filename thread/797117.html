<b>标题: </b>关于应用能源的一些问题<br /><font size="4">为什么在一个存档里，我的网络在装安全终端后无法让第二名玩家放进或储存物品到ae中？</font><br />
<font size="4">这该如何解决&nbsp;&nbsp;在线等急~</font><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>kbxxa&nbsp; &nbsp; <b>时间: </b>2018-5-31 21:34<br />
你需要做个信息卡，还是身份卡来着。然后让你需要添加的玩家拿着它shift右键，然后你把这个卡拿到安全终端GUI下面的格子里面设置，把5个权限都给了，然后放到安全终端GUI上面就可以了。
