<b>标题: </b>喜欢的建筑风格<br />经过近一年的mc经历，逐渐明白自己喜欢怎样的建筑风格了，对于服务器里的公共建筑我还是比较倾向于小巧精致的。我不喜欢气势和规模庞大的建筑，因为那样显得很空旷，有种无所适从的感觉，身处在那种空旷的建筑立面感觉很压抑，而像苏州园林式的建筑风格，还是比较喜欢的，小巧精致让人感觉很温馨，很惬意。<br />
