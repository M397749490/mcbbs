<b>标题: </b>用1.12.2版本林业的服主注意了！<br />林业1.12.2 直到最新的版本：forestry_1.12.2-5.8.2.382.jar 存在一个重大bug<br />
bug条件：用精准采集 采集果树树叶<br />
效果：只要该树叶在背包内就会导致客户端崩溃<br />
解决办法：暂无！，ban掉所有林业的树叶并不能解决，只要有精准采集的破坏，就会触发。而且清空背包后，客户端虽然不会崩溃，但会一直闪屏，并且目前没有良好解决办法。<br />
建议各位服主警告玩家不要尝试。
