<b>标题: </b>Mojang创始团队将离职<br /><font style="color:rgb(0, 0, 0)"><font style="background-color:rgb(255, 255, 255)"><font face="Arial, 宋体">北京时间9月15日晚间消息，微软周一正式宣布，以25亿美元的价格收购热门游戏《Minecraft》的开发商Mojang。<br />
　　在这笔收购之后，《Minecraft》的开发者、35岁的瑞典人马库斯·佩尔森(Markus Persson)将离职。而另两名创始人，包括CEO卡尔·曼恩(Carl Manneh)和雅克布·珀瑟(Jakob Porser)也将离职。</font></font></font><br />
