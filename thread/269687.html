<b>标题: </b>群峦传说烧制陶器干草填不满<br />从mcbbs上下的1.6.4的群峦传说mod，教程上说烧制陶器要15个干草，但是我按到第八个就不能继续了。怎么回事<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>liuyurockman&nbsp; &nbsp; <b>时间: </b>2014-4-27 23:51<br />
群峦传说最近更新了<br />
填8个干草后，再填8根原木（右键放置）把模具所在的格子填满，这时把坑的四周围好，点火就可以了<br />
顺便一提，新版的烧制陶器的坑只要一格深就可以了，也算是作者为了方便玩家做出的改进吧：）
