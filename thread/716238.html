<b>标题: </b>【水】旅游真没意思...<br />上周去贵州，广西一带旅游，现在感觉各种没意思<img src="static/image/smiley/rabbit/35.gif" smilieid="685" border="0" alt="" /><br />
天气热，太阳晒，为了看景点一早就要从酒店起来出发，到了景区各种排队，买票排队，验票排队，坐大巴排队，有时一排就一个小时，站的脚酸痛，有时突然下雷阵雨又全身湿透<br />
关键是没什么好玩的，看这些景点真心不如在网上随便搜点纪录片<br />
唯一还行的就是有一天在贵阳的酒店里休息，那一天我认真地研究了我从来不玩的pe mc中的一些特性<br />
回来的路上我只想着再也不旅游了<br />
我是不是宅的没救啦？<br />
