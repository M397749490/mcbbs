<b>标题: </b>BC液泵机器人太不靠谱了吧<br />BC液泵机器人太不靠谱了吧。<br />
我放好机器人并充好能量，打算在下界抽岩浆。不料，那个机器人出发后花了五分钟绕着一面墙转了四分之三圈，进入一个洞，从那里抽了一格单方块岩浆，又绕了几圈，才会到转接坞上面。整个过程10分钟才抽了1格岩浆。效率太低了吧？大大的岩浆海不去，非要钻牛角尖。<br />
