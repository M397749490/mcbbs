<b>标题: </b>我的世界皮肤教程<br /><font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">其实不用那么麻烦</font></font></font><br />
<font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">用压缩包打开.minecraft</font></font></font><br />
<font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">再打开versions</font></font></font><br />
<font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">打开你下载的版本</font></font></font><br />
<font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">点有java标志的那个</font></font></font><br />
<font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">再打开assets</font></font></font><br />
<font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">打开Minecraft</font></font></font><br />
<font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">然后打开textures</font></font></font><br />
<font color="#000"><font style="background-color:rgb(255, 255, 255)"><font face="Tahoma, Arial, Helvetica, sans-serif, SimSun">最后打开entity</font></font></font><br />
