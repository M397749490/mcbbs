<b>标题: </b>关于鸡舍的问题<br />我在一些视频里看见有人建的鸡舍下面装了水，我也想建个相同的，问下怎么才能让水在半空中不落下来？<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>大の世界&nbsp; &nbsp; <b>时间: </b>2012-7-17 11:30<br />
放牌子或方块<br />
&nbsp;&nbsp;建议牌子&nbsp;&nbsp;<br />
因为牌子为一种可穿越式的方块（block）你懂的<br />
只要你把牌子看做方块来放 就既能挡水又能让主角过去&nbsp;&nbsp;穿越不知合不合适用在这里 = =<br />
<br />
