我的超简易（小白专用，我也是小白）自动售货机，是人都会。<img id="aimg_mCn5S" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" src="http://ww3.sinaimg.cn/mw690/dabf299bgw1eji2bygyy9j20nq0dcju3.jpg" onmouseover="img_onmouseoverfunc(this)" onload="thumbImg(this)" border="0" alt="" />漏斗连上箱子（我没连）<img id="aimg_ExZWB" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" width="690" height="388" src="http://ww1.sinaimg.cn/mw690/dabf299bgw1eji2bz8m07j20nq0dcdiy.jpg" border="0" alt="" />在两边放砖块再放上绊线勾与线<img id="aimg_c50oi" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" width="690" height="388" src="http://ww3.sinaimg.cn/mw690/dabf299bgw1eji2c6sljaj20nq0dcq5h.jpg" border="0" alt="" />把一个绊线勾连上命令方块，命令方块中填give @p xxx xxx中填你售卖的物品编号。<img id="aimg_S3vdS" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" width="690" height="388" src="http://ww4.sinaimg.cn/mw690/dabf299bgw1eji2c8ppihj20nq0dc79d.jpg" border="0" alt="" />在离漏斗8格的地方放上水周围要围上<img id="aimg_WDsNS" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" width="690" height="387" src="http://ww4.sinaimg.cn/small/dabf299bgw1eji2nhh5wmj20nq0dc77l.jpg" border="0" alt="" />做一个投币口。<br />
<img id="aimg_j3UK8" onclick="zoom(this, this.src, 0, 0, 0)" class="zoom" width="387" height="387" src="http://ww1.sinaimg.cn/sq612/dabf299bgw1eji2punmf9j20nq0dcmze.jpg" border="0" alt="" />最后做一下装饰即可。<br />
