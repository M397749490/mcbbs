<b>标题: </b>1.9+物品特殊属性问题！<br />1.9+如何只有特定位置穿戴了这个东西才会获得这个东西的属性，说的简单点，就是这个东西只有在特定位置才会优特殊属性，例如副手拿着钻石剑会+7攻击力，主手反而不会，皮革帽子只能在胸甲格才护甲值+1等等......<br />
（其实还有一个原因，就是直接弄下面好长一条&nbsp; &nbsp; 在副手攻击+8 在主手攻击+8 穿在身上攻击+8）<br />
