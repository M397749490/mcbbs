<b>作者: </b>1010009159&nbsp; &nbsp; <b>时间: </b>2015-4-5 15:05<br />
<b>标题: </b>服务器怎么换地图 是地图不是整个世界<br />怎么换整个地图我知道改world换整个世界的<br />
如果我在服务器里面用mv开了个新的世界呢？<br />
那个新的世界怎么换<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>學委&nbsp; &nbsp; <b>时间: </b>2015-4-5 15:26<br />
你不需要创造新世界。你只需要把世界文件改名，放入world文件中，重启服务器，进入游戏/mv import 存档文件名 normal。这样就能用了。如果你只是想要建筑或区域，配合WE插件复制粘贴就好了。
