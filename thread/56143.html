到8级后按I 选择做恶行&nbsp;&nbsp;然后选择最邪恶的选择&nbsp;&nbsp;然后获得杖后<br />
按右键就出现奴隶了<br />
对树右键 奴隶会砍树<br />
对动物可以举起来<br />
按I就可以挖地洞了<br />
