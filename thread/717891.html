<b>作者: </b>bill712&nbsp; &nbsp; <b>时间: </b>2017-8-9 21:54<br />
这个做不到的啊，并不是说像某些单机mod一样把mod放进客户端核心就能运行。要运行绝大多数mod需要forge，因为没有接口服务器是没办法使用mod的。而且像spigot这类型的服务端是不支持mod的，你把mod放进核心不仅没法加载，还可能导致服务端跑不起来。
