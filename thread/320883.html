<b>标题: </b>我的世界领地权限指令怎么用<br />我在梅花城服务器圈了一块领地，我怎么把领地权限设成只有我才能在里面移动+放置、破坏方块？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>44724345&nbsp; &nbsp; <b>时间: </b>2014-8-13 20:29<br />
/res pset 领地名称 trusted true&nbsp;&nbsp;把trusted换成其他权限就可以了别人移动move/res pset 领地名称move true&nbsp; &nbsp;&nbsp;&nbsp;如果给一个人全部权限是这个/res pset 领地名称 trusted true&nbsp;&nbsp;
