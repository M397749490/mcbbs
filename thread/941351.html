<b>标题: </b>服务的核心抢占问题<br />服务器一共6核12线程<br />
我开BC里边链接的三个U端<br />
还单独开一个cat的神奇宝贝<br />
会不会出现CPU性能资源抢占的情况？就是两个端共同吃一个核心<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>恋&nbsp; &nbsp; <b>时间: </b>2020-1-14 16:05<br />
虽然理论上不会出现这样的情况 如果你不放心的话 <br />
开一个服务端 打开你的任务管理器&nbsp;&nbsp;然后找到服务端的进程 右键 转到详细信息&nbsp;&nbsp;然后在右键 设置相关性 把所有处理器的勾去掉&nbsp;&nbsp;然后手动给这些服务端分配需要使用的核心
