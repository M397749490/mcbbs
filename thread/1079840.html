<b>标题: </b>可以代替梯子的东西又多了<br />我这才发现1.16又多了两种可以爬的植物，一种叫<strong>垂泪藤</strong>，另一种叫<strong>缠怨藤</strong>。<br />
<br />
垂泪藤和藤蔓一样是从上往下生长的，而缠怨藤是从下往上生长的。<br />
<br />
现在这样看来可以代替木梯子的有藤蔓、脚手架、垂泪藤和缠怨藤。<br />
<br />
我觉得脚手架是最方便的，至少可以活动的范围大了。你们认为呢？
