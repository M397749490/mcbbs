<b>标题: </b>求助。圈地问题。<br />比如：枪械服务器里需要卖给玩家一个小房子，让玩家只能使用（破坏）一个小房子，其他地方没有权限使用（破坏），，怎么样才可以使整个世界不能破坏，然后要其中的一个房子的可以破坏。<font color="#ff0000">希望大佬说的详细一点！</font><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>帅杀风云110&nbsp; &nbsp; <b>时间: </b>2018-2-14 19:01<br />
楼主可以先把要出租的屋子设置一个领地，然后分别在每个小房间里设置子领地，出租时把子领地给玩家就可以了
