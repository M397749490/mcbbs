<b>作者: </b>wx564858304&nbsp; &nbsp; <b>时间: </b>2012-8-5 15:42<br />
/sk list可以查看新手礼包内容<br />
 /sk load可以载入新手礼包内容到身上(会清空身上原本物件)<br />
 /sk save这个就是用来设置新手礼包内容的,比如身上有一个石稿子,那么使用该命令后新手礼包内容即为头石稿子<br />
