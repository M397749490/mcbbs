<b>标题: </b>这是怎么回事？<br />我用setblock指令，结果显示不能在世界外放置方块，我检验了xyz地址，发现一切都正确，只不过放置方块的地方和我站着的地方远了点而已，是这个原因吗？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>gamemode3&nbsp; &nbsp; <b>时间: </b>2015-2-10 19:01<br />
如果目标地点离开了被玩家加载的区块就会显示不能在世界外放置方块,<br />
比如说我站在100 40 100坐标的时候输入/setblock 1 40 1就会提示不能在世界外放置方块
