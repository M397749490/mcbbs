<b>标题: </b>魔法源质的魔法纯净铁怎么得到<br />怎么找也找不到合成方法<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>jack459379531&nbsp; &nbsp; <b>时间: </b>2013-3-12 17:52<br />
你在合成表找到魔法合成台，然后做一个魔法合成台（魔法合成台需要魔力才能运行），然后把铁矿放到魔法合成台正中间，就能出现魔法纯净铁了。
