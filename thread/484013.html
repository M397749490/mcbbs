<b>标题: </b>[命令方块]可以放置在<br />如题让冒险模式一个方块可以放置在一种方块上的NBT是什么<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>scorpio975&nbsp; &nbsp; <b>时间: </b>2015-8-10 09:05<br />
<div class="blockcode"><div id="code_qVG"><ol><li>/give @p minecraft:lever 1 0 {CanPlaceOn:[&quot;minecraft:stone&quot;]}</ol></div><em onclick="copycode($('code_qVG'));">复制代码</em></div><br />
给最近的人一个只可以放在石头上的拉杆<br />
{CanPlaceOn}就是这个NBT<br />
可以加入多个东西，用逗号隔开，记得加上引号
