主要靠RP，在探索天然洞穴時，如果聽見有許多怪物叫聲，那就證明你離地牢不遠了。<br />
<br />
作用主要就是刷怪，可以利用地牢來刷怪物身上掉的物品。<br />
<br />
不用修改器的話無法人工設置。
