<b>标题: </b>怎么删除玩家qs创建商店权限<br />qs商店开通 玩家默认有权限&nbsp;&nbsp;就不知道怎么取消 求解<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>xRPQx&nbsp; &nbsp; <b>时间: </b>2015-8-30 10:29<br />
既然楼主说是默认有的，那请输入<br />
/mangaddp <font color="Red">default</font> -quickshop.create.sell&nbsp;&nbsp;<br />
/mangaddp <font color="Red">default</font> -quickshop.create.buy<br />
<br />
(记得后面权限的-要带上！红色的default可以换成其他权限组名字~~)
