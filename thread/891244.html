就是在地牢宝箱中探索得到的<br />
如果你加了其他的地牢或者冒险mod 箱子中有可能不会刷新学院都市mod中的诱导因子而是其他mod的物品<br />
如果是这种情况 建议你去原版的地牢中探索<br />
当然也有可能单纯是你脸太黑
