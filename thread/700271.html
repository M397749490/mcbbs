<b>标题: </b>带方块实体数据的物品数据失效<br />1.12 PaperSpigot服务器<br />
用各种方法得到带方块实体数据的物品，由非op或非创造模式玩家使用后，方块实体数据不会生效<br />
（箱子放下后会是空的，刷怪箱只会刷猪）<br />
所有插件都删了也没用<br />
但单机各种情况下都有效（箱子不是空的，与原箱子完全相同）<br />
