<b>标题: </b>细菌mod怎么复制东西<br />有人说细菌除了可以吞噬方块外，还可以复制方块，要怎么复制啊{:10_527:}<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>HarryJiang&nbsp; &nbsp; <b>时间: </b>2013-10-18 11:32<br />
细菌有两种，一种是紫色的吞噬细菌，一种是红色的代替细菌，举个例子，你想把草方块换成石头，你把一块石头放在一块草方块上再在石头上放红色细菌，按下控制器就可以了，只要是和那个草方块相邻的同种方块全都会被替换成石头
