<b>标题: </b>怎么禁用ESS的kill？<br />就是我想用kill指令清除实体，但有ess插件之后kill指令变成了只能清除玩家，我想清除的是mod里面的特殊实体，在原版单机用kill已经没问题了，remove这个指令又只能清除特定的实体不能清除mod里面的特殊实体<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>もぺもぺ&nbsp; &nbsp; <b>时间: </b>2020-6-13 13:32<br />
使用 /minecraft:kill 代替 /kill 即可
