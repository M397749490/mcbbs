<b>标题: </b>满江红.闻母涕零有感而作<br />阅历世事，早已是不惑年华。为家事无人处置，操劳意志。久无睡眠积劳苦，人未理会无处诉。问苍天何能领此痛，泪涌出。<br />
奋笔疾书，且夺得中考佳绩。却听闻扎心之言，脑如浆糊。欲上大学拼出路，勤读之余却无助。问大地谁人为之悟？无陈述。<br />
