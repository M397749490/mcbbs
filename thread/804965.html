<b>标题: </b>[原创_单篇]失落的帝国（上）<br />[ 本帖最后由 散秋polar 于 2018-7-11 16:10 编辑 ]\n\n原创诗[失落的帝国]<br />
<br />
（上）<br />
贪婪和洪流彻底击毁了家园，<br />
出逃，<br />
只留下了一段传说。<br />
所罗门王的神殿，<br />
铸造了西斯廷。<br />
被群狼所守，为大西洲而说，<br />
梦，<br />
是古都沉没时众生的呐喊。<br />
迷失的大陆，<br />
亚特拉斯。<br />
远古那水晶沙漏，<br />
与众神一并归入沉寂，<br />
倾听，<br />
信仰的力量。<br />
封印了万年的史诗，<br />
复国，<br />
永恒，<br />
沧海之穹。<br />
<br />
