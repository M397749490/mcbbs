<b>标题: </b>服务器如何死亡删物品而不是掉落<br /><br />
<br />
如何让一个玩家在一个世界死亡后会删物品，不会掉落东西？（饥饿游戏）<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>汤圆宝宝&nbsp; &nbsp; <b>时间: </b>2016-7-16 20:24<br />
你可以让他死后出生在一个踏板上，踏板下面放命令方块，写：/clear @p 。 然后再用红石接着一个命令方块写：/tp @p X Y Z XYZ就写你主城的坐标...这样应该行吧，最简单的办法...
