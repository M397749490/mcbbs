<b>标题: </b>地皮 压力板/按钮的使用<br />服务器的玩家领了地皮<br />
说是没有权限的玩家<br />
也能使用自己领地中的踏板 按钮之类的<br />
请问这个如何解决<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>asdtyx&nbsp; &nbsp; <b>时间: </b>2016-7-27 12:21<br />
命令方块写: manuaddp @p plotme.limit.1<br />
如果无法使用在服务器根目录找到commands.yml文件<br />
打开找到<br />
command-block-overrides:部分<br />
添加这个:<br />
- manuaddp<br />
