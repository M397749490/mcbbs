<b>标题: </b>关于这一行为的鉴定<br />前言：小号多的好处。<br />
正文：<br />
先假设这个情景：<br />
A想要给B回血，<br />
但是A觉得回血回到其他帖子里不妥。<br />
正好A有很多小号，<br />
于是A便开小号给B回血。<br />
或者A要给B奖励，但是不同帖子觉得不妥，<br />
于是就让小号给B以规定数目。<br />
请问以上算不算是开小号刷？<br />
其实么，说真的，开小号刷还是直接用大号经济。<br />
我只是强迫症罢了。<br />
