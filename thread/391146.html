<b>标题: </b>TE熔岩炉如何导出液体<br /><font face="Impact"><font size="3">RT，即如何将熔岩炉中的液体导进流体转制器</font></font><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>wish2012&nbsp; &nbsp; <b>时间: </b>2015-1-27 13:26<br />
熔岩炉流体转移器并列放，然后打开熔岩炉的GUI，选择点击右边第三个按钮（就是有齿轮的那个），就会展开一个配置界面，然后将熔岩炉与流体转移器相邻的那个面改成输出模式（通过不断点击将其颜色变为橙色），同样的方法修改流体转移器将其与熔岩炉相邻的面改成输入模式（蓝色）
