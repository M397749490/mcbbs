<b>标题: </b>版本特性碰撞体积<br /><font size="7">是这样的..因为版本是1.11.2，用mm插件做的怪物有体积碰撞，不知道有没有插件可以解决这个问题。</font><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>824631575&nbsp; &nbsp; <b>时间: </b>2017-12-1 17:38<br />
Collidable: [true/false] (2.4)<br />
<br />
此生物是否可碰撞<br />
默认 true<br />
注意碰撞在 Minecraft 里是双向的，所以有必要将碰撞的两个实体的碰撞都设置为 false 来保证碰撞不会发生<br />
<br />
加了这个怪物之间就不会碰撞了
