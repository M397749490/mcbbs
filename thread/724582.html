<b>标题: </b>自我介绍<br /><p style="line-height:40px;text-indent:nullem;text-align:left"><font style="color:rgb(165, 122, 63)"><font style="background-color:rgb(245, 245, 245)"><font face="Arial, SimSun">我叫Jester。</font></font></font></p><p style="line-height:40px;text-indent:nullem;text-align:left"><font style="color:rgb(165, 122, 63)"><font style="background-color:rgb(245, 245, 245)"><font face="Arial, SimSun">我特别喜欢制作泥画，最近还在作春景呢！我还喜欢看课外书和电脑绘画。曾获得学校第一届四年级组课外知识竞赛三等奖，电脑绘画三等奖两次。</font></font></font></p><p style="line-height:40px;text-indent:nullem;text-align:left"><font style="color:rgb(165, 122, 63)"><font style="background-color:rgb(245, 245, 245)"><font face="Arial, SimSun">我的缺点就是爱看电视，爱玩电脑，不顾作业，就因为这个，我妈妈经常和我吵翻了天。</font></font></font></p><p style="line-height:40px;text-indent:nullem;text-align:left"><font style="color:rgb(165, 122, 63)"><font style="background-color:rgb(245, 245, 245)"><font face="Arial, SimSun">我的优点就是不爱用零花钱。</font></font></font></p><p style="line-height:40px;text-indent:nullem;text-align:left"><font style="color:rgb(165, 122, 63)"><font style="background-color:rgb(245, 245, 245)"><font face="Arial, SimSun">我最讨厌猫狗，因为它扪身上有很多的跳蚤，咬地我全身都是疤。</font></font></font></p><p style="line-height:40px;text-indent:nullem;text-align:left"><font style="color:rgb(165, 122, 63)"><font style="background-color:rgb(245, 245, 245)"><font face="Arial, SimSun">这就是我，听完了我的介绍对我有些了解了吧！</font></font></font></p><br />
