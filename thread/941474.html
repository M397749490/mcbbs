<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Strange_name&nbsp; &nbsp; <b>时间: </b>2020-1-14 19:42<br />
两种方案<br />
一、用末影箱<br />
二、如果末影箱装不下，弄成陷阱箱，后面连个命令方块，里面写“/kill @a[r=5,!&lt;你自己的名字&gt;]”，这样可以实现让所有打开箱子的人除了你自己都死掉<br />
