<b>作者: </b>照烧鸡腿饭&nbsp; &nbsp; <b>时间: </b>2016-6-26 21:58<br />
给玩家权限 plots.plot.数量<br />
可以加个全局权限到玩家组，比如限制1个，就是plots.plot.1<br />
然后让玩家买或者获取的话，就给相应数量上限的权限，和默认权限不会冲突（以最大的为准）
