<b>标题: </b>模组：怎么进行实体数据客户端与服务端同步<br />写了一个实体，然后在客户端渲染的时候需要用到这个实体的一些数据，但是这些数据在调用的时候只会在服务端有，客户端同步不到<br />
然后我就写了一个数据包，专门同步实体数据（在实体在服务端生成的时候调用），的确同步到客户端了<br />
但是一旦区块被卸载（玩家离开实体一定距离或者没有看到实体），再次回到这个区块的时候，数据就又没了<br />
求解怎么进行实时数据同步啊<br />
