<b>标题: </b>关于自定义NPCMOD的问题<br />自定义NPC的皮肤和披风保存在哪<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>welpm&nbsp; &nbsp; <b>时间: </b>2015-6-3 20:56<br />
自定义NPCmod用解压工具解压 打开以下目录\assets\customnpcs\textures\entity<br />
里面就是皮肤的分类，你可以自己建一个分类，不过不可以出现中文。<br />
皮肤文件必须以png格式结尾。披风在\assets\customnpcs\textures\cloak。
