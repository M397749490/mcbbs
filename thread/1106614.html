<b>标题: </b>玩家被提供的区块数被固定了<br />RT，就是玩家能看到的区块数固定了<br />
比如，客户端这里调的32视距，服务器提供8视距<br />
那么以前都是在32内能看到路过的区块，区块能累积，走过的区块不会被去除<br />
而现在不管客户端视距多少，走过的区块都被删除了<br />
最近服务器从1.16.1转换成了1.16.2了<br />
