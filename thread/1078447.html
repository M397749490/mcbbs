<b>标题: </b>南乡子<br />大水何处有？茶馆茫茫无尽头。均帖水分占几何？十九。或如惊涛或细流。<br />
忆昔初临时，尝当居仕向看齐。如梭光阴至今矣，未立，仍思何时至高地。<br />
