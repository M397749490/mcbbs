<b>标题: </b>你喜欢哪种类型的解密地图？<br />依据侧重点的不同，解密地图可大致分为剧情型和概念型。剧情型侧重文本，比如各类小品解密；概念型侧重逻辑，比如 The Code 系列。<br />
目前大陆市场上还是剧情型居多，相对而言概念型可能因为太费脑以及技术门槛较高就很少人去做。<br />
这里喜欢概念型，感觉概念型更有解密的味道，好像有些地图还略带科幻风（？）
