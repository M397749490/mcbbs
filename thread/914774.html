原版的话，动物本身是无论如何都不会攻击的<br />
你可以召唤一个隐形无敌无声音的僵尸，然后让动物一直tp这个僵尸<br />
也就是让僵尸帮动物攻击<br />
持续让僵尸执行检测命令，检测该动物死亡就kill自己<br />
