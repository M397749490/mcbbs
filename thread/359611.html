<b>标题: </b>爆炸物引起的方块破坏阻止？<br />就如标题所说，在下目前手头有几个mod里面带有爆炸物（比如战争装备、flan等）<br />
咱想让这些mod里面的爆炸物不会破坏方块，请问有办法么0A0<br />
PS：单机，不是服务器<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>1441423941&nbsp; &nbsp; <b>时间: </b>2014-10-31 19:13<br />
/teams explosions false 禁止爆炸物破坏<br />
/teams canBreakGlass false 禁止子弹破坏玻璃、萤石等
