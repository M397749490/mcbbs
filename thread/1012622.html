<b>作者: </b>Azitate&nbsp; &nbsp; <b>时间: </b>2020-4-9 11:55<br />
CMI并没有功能可以控制玩家进服手持指定slot快捷栏的功能吧<br />
你可以设置一个新手礼包,然后在礼包快捷栏的第一格放上你想设置的书即可<br />
