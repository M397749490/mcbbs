内容:<br />
 假设我在一个地方放置了10个普通箱子<br />
在特定地点又放置了4个箱子，怎么将这10个箱子里面的东西随机放置到这四个箱子中<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>ruhuasiyu&nbsp; &nbsp; <b>时间: </b>2018-10-14 08:11<br />
打破十个箱子，然后在四个箱子上面放漏斗，把十个箱子掉的东西spreadplayers到漏斗上方的区域，不停循环直到区域内没有物品为止。然后清理漏斗
