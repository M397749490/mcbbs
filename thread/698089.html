<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>common&nbsp; &nbsp; <b>时间: </b>2017-6-17 15:25<br />
把宝珠放在祭坛里，不要取出来，献血或者屠宰直到把这个宝珠完成，祭坛里血液耗尽还没完成的话进度不清零，这时候想办法往里面送血(献血或者屠宰或者用管道往里面输血)
