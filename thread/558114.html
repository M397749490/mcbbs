如果有MV多世界插件 就输入指令/mv modify set pvp false 禁止PVP /mv set monsters false /mv set animals<br />
这两个指令可以禁止 动物和怪物的自然生成 输入之后指令/killall all 杀死所有生物 就不会再有活体出现除了玩家<br />
必须在地皮世界里面输入!
