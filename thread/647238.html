<b>标题: </b>服务器老是卡卡的<br />服务器在有人登录或者传送的时候就会卡一二秒<br />
这是什么问题啊？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>阴阳师元素祭祀&nbsp; &nbsp; <b>时间: </b>2016-11-7 21:25<br />

会导致区块加载<br />
【随机传送有可能还要新生成区块<br />
导致服务器要发送区块数据【大量【除非能见度很低<br />
或者生成时还占CPU和内存<br />
<br />
解决方法:升级服务器配置<hr noshade size="2" width="100%" color="#808080">
