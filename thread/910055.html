<b>标题: </b>你们怎么看网易的<br />网易好不容易把Minecraft代理权买到手，但是很多人不支持，你怎么看？<br />
我觉得他们不支持原因:<br />
1.购买国际正版的人不服免费玩到网易mc的人<br />
2.国际版资源免费且实用，网易版要大量氪金才能获得优质资源<br />
3.网易代理的太烂，挂逼多<br />
我觉得mc友军应该联合[不管是国服还是国际服]，不然自己人都玩mc的，还起内讧，怎么打退迷你？<br />
我其实是看国际版不错，网易玩的少<br />
总之，mc招新只要不玩迷你这种游戏就行，没必要在乎玩国际版还是中国版<br />
