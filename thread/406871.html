<b>标题: </b>如何给玩家使用命令方块的权限<br />用ESS，玩家踩上命令方块不能传送。求使用命令方块的权限是什么<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Krito&nbsp; &nbsp; <b>时间: </b>2015-2-11 14:57<br />
首先你要开启服务器的命令方块功能，server.properties文件中修改enable-command-block=true，改成true就开启了命令方块。然后玩家就可以用
