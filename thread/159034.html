<b>标题: </b>与门特性<br />谁能教我一下与门的特性如何这么应用：一个输入端接拉杆，一个接按钮，与门输出端接你家大铁门——拉杆放在你身边，按钮放在门外。这样只有当你身边的拉杆输出为1时，按钮按下时门才会打开。拉杆就相当于一个“门锁”了。<br />
