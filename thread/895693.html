<b>标题: </b>AAC重载几十秒后检测全部消失，但还能相应命令<br />AAC4.0.7最新版本，spigot1.8.8服务端，AAC重载完的最初几十秒所有检测都正常，能检测到作弊玩家，飞行也会被拉回。但是每次到一定时间后所有检测全部失效，飞行也不会被限制了。<br />
另外一个问题就是，这时可以用aac reload重载插件，重载后的情况同上。<br />
检测从有效到无效时，没有任何报错<br />
