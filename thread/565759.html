<b>标题: </b>红石安全门<br />红石安全门制作非常简单<br />
用途广途<br />
<br />
制作方法：<br />
装备一个石质踏板，铁门，红石火把，任何方块。<br />
<br />
先放上门，在门的后面放红石火把，再在红石火把后放石制质踏板，使前三个方块成一条线，然后包装一下。<br />
<br />
原理<br />
当踩在踏板上，熄灭红石火把，门关上。<br />
人不在反之。<br />
