<font size="4">1.自动刷雪机---就是水流冲雪人那个</font><br />
<font size="4">2.无限岩浆---就是红石产生岩浆源那个</font><br />
<font size="4"><br />
</font><br />
<font size="4">这个技巧，确实是可以成功的，并不是凭空编造的。</font><br />
<font size="4">但是我试过无效。。。。</font><br />
<font size="4">后来才知道真相是：这些更本不是原版BUG 而是Forge的BUG。。。</font><br />
<font size="4">所以原版JAR不能用，服务器不能用。</font><br />
<font size="4"><br />
</font><br />
<font size="4">也算给不知情的小伙伴们提个醒吧。。。</font><br />
