<b>标题: </b>玩mc的经历<br /><font color="#333333"><font face="arial"><font style="font-size:16px">MC有苦，当然也有甜。这里承载着我们青春的时光。昨天在逛《我的世界》论坛的时候，看到一位玩家大喊道：“兄弟们，我恋爱啦！”看到这，我不禁感动。Minecraft有着无数的小哥哥和小姐姐，不同的城市，不同的年龄，不同的背景。但却能跨越障碍，走到一起。也许多少年后也许在他们婚姻的殿堂里，会留下这么一段话：我们相遇Minecraft，相知Minecraft，如今相守一生！</font></font></font><br />
