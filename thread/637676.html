<b>标题: </b>给了玩家一个宠物权限，怎么取消掉？<br />就是一个僵尸的权限，给了玩家，如何在取消掉，就是让玩家没有僵尸这个权限<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>夜猫H&nbsp; &nbsp; <b>时间: </b>2016-10-1 12:15<br />
从权限组删除那个权限<br />
/mangdelp xxx yyy ＝ 删除用户组xxx的yyy权限<br />
<br />
/manuaddp xxx yyy ＝ 给用户xxx添加yyy权限
