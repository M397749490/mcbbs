从上到下 流水线 最好长一点 每次到下 give到达的玩家金币 然后通过tp或者warp res等 把玩家传送到流水线起始位置<br />
流水线一定不能有第二个入口或者折回&nbsp;&nbsp;方块点也必须是重点
