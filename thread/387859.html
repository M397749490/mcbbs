<b>标题: </b>关于1.5.2的更多生物mod<br />在1.5.2的更多生物里下不了马，在按键列表里写的是F，但是按了没反应，而且马也跳不起来。是怎么回事？<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Hey丶康&nbsp; &nbsp; <b>时间: </b>2015-1-20 19:41<br />
可能是mod与原版冲突了吧<br />
默认设置是Shift下马，按空格蓄力跳<br />
你可以恢复默认按键后试试<br />
或者移除mod之后再试试<br />
不排除你的键盘按键坏掉的可能
