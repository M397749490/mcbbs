<b>标题: </b>【清明节】诗歌欣赏<br /><div align="center"><font face="楷体, 楷体_GB2312"><font size="6">渡江云三犯·西湖清明</font></font></div><div align="center"><font size="1">宋代——吴文英</font></div><br />
<div align="center"><font face="楷体, 楷体_GB2312"><font size="4">羞红颦浅恨，晚风未落，片绣点重茵。</font></font></div><div align="center"><font face="楷体, 楷体_GB2312"><font size="4">旧堤分燕尾，桂棹轻鸥，宝勒倚残云。</font></font></div><div align="center"><font face="楷体, 楷体_GB2312"><font size="4">千丝怨碧，渐路入、仙坞迷津。</font></font></div><div align="center"><font face="楷体, 楷体_GB2312"><font size="4">肠漫回，隔花时见，背面楚腰身。 </font></font></div><div align="center"><font face="楷体, 楷体_GB2312"><font size="4">逡巡。题门惆怅，堕履牵萦，数幽期难准。</font></font></div><div align="center"><font face="楷体, 楷体_GB2312"><font size="4">还始觉、留情缘眼，宽带因春。</font></font></div><div align="center"><font face="楷体, 楷体_GB2312"><font size="4">明朝事与孤烟冷，做满湖、风雨愁人。</font></font></div><div align="center"><font face="楷体, 楷体_GB2312"><font size="4">山黛暝，尘波澹绿无痕。</font></font></div><div align="left"><font face="楷体, 楷体_GB2312"><font size="4">&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; &nbsp; <span id="mp3_kjZ"></span><script type="text/javascript" reload="1">$('mp3_kjZ').innerHTML=AC_FL_RunContent('FlashVars', 'soundFile=http%3A%2F%2Fup.yuedisk.com%2Fwl%2Furl%2Fvinkyever%2F138057%2Fyuedisk.mp3', 'width', '290', 'height', '24', 'allowNetworking', 'internal', 'allowScriptAccess', 'never', 'src', 'static/image/common/player.swf', 'quality', 'high', 'bgcolor', '#FFFFFF', 'menu', 'false', 'wmode', 'transparent', 'allowNetworking', 'internal');</script><br />
