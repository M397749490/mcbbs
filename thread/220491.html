<b>标题: </b>多世界插件怎么设置难度<br />怎么设置只有一个世界不刷怪的&nbsp;&nbsp;服务器有一个游戏世界&nbsp;&nbsp;老刷怪很烦的<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>Ming_Hui&nbsp; &nbsp; <b>时间: </b>2014-1-17 17:06<br />
先进入服务端，打开多世界插件文件夹。打开worlds.yml&nbsp; &nbsp;。主要不是config.yml&nbsp;&nbsp;。然后找到你那个游戏世界。找到难度。把难度改成和平。重启服务器就好了。difficulty: PEACEFUL
