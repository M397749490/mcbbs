先查到玩家的UUID，这个在玩家登陆服务器的时候后台会显示出来，然后找到world\playerdata\对应的UUID以及玩家ID（如果有的话），删掉这些数据，玩家就被重置了，权限组金币登录密码等等都不会有影响
