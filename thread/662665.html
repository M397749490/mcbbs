<b>标题: </b>分享一下各位神奇的电话经历吧<br />某天，我说想去某朋友家玩，我妈叫我到了他家就打个电话回去<br />
然后到了他家我就打电话给我妈<br />
我妈知道是我，我才刚说“喂”，连“妈”都还没来得及叫<br />
她就一直说“好了好了我知道你到了到时间了我就去接你”<br />
然后我“嗯”的一声就把电话挂了<br />
挂了之后我朋友跟我说<br />
“我还没见过这样打电话的，一个‘喂’，一个‘嗯’就挂了”<br />
