分别为1.<i><u>吸取模式</u></i>：把水，岩浆吸进背包。<u><i>对其他方块点的时候会喝下液体</i></u>（喝岩浆会有增益效果和着火，主要用来喝牛奶）<br />
2.<i><u>喷洒模式</u></i>：放出水，岩浆<br />
<font size="4"><font color="#ff0000">shift+m键</font></font>切换左/右洒水箱。<font size="3"><a href="http://v.youku.com/v_show/id_XODcyNDE0MDYw.html?f=21486451" target="_blank">籽岷视频</a> <u><i>21:50&nbsp;&nbsp;</i></u>开始 </font><br />
