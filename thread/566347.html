<b>标题: </b>有什么办法能让命令方块执行插件的指令嘛<br />命令方块在服务器里只能执行原版指令，我想要让它执行插件指令，请问有没有什么插件能让它执行<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>速升轩&nbsp; &nbsp; <b>时间: </b>2016-3-12 20:17<br />
你可以选择脚本方块插件<br />
把指令绑到这个方块上 点击这个方块就能使用绑定的指令<br />
还可以设置使用指令的冷却时间<br />
还可以踩踏触发<br />
还可以绑定越权指令<br />
