<b>标题: </b>权限无法移除<br />嗯。。主要的情况就是想在某一个世界把所有传送命令的权限移除 可是用/mangaddp移除显示default组本来就没有这个权限 把op下掉之后传送命令也可以用。。到底怎么办求大神解决<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>a8105&nbsp; &nbsp; <b>时间: </b>2014-4-26 20:05<br />
/mangaddp default -essentials.tpa&nbsp; &nbsp;&nbsp;&nbsp;tp,home,sethome,spawn,在权限名称前面加个横杠(-)代表移除该权限
