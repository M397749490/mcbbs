<b>标题: </b>关于服务器枪械恶意pvp问题<br />服务器模组是维克的现代战争，领地防止不了枪械伤害。。关闭pvp也不行有什么插件可以制止吗，盼复，谢谢<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>ff7786&nbsp; &nbsp; <b>时间: </b>2020-6-26 13:36<br />
在领地内输入 /resadmin set damage f 即可完成无伤领地 你只关闭PVP权限仅是关闭了近战的PVP，damage 这个是关闭所有伤害 包括领地内的坠落伤害和效果伤害.
