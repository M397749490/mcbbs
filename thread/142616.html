<b>标题: </b>如何改服务器的模式？<br />自己开了个服，想把生存变成创造，怎么该？<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>ouqianwei&nbsp; &nbsp; <b>时间: </b>2013-7-14 19:58<br />
那么你是想把整个服务器都设置为创造呢，还是个人设置为创造呢？<br />
个人的话输入:/gamemode 1 &lt;玩家&gt;<br />
整个服务器的话,用记事本打开server.properties<br />
把里面的gamemode=0改为gamemode=1<br />
希望帮你解决
