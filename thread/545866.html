<b>标题: </b>大家喜欢哪一种类型RPG？<br />由于本人开服了，但是不知道玩家们喜欢哪一种RPG呢？<br />
1.纯副本型，武器靠刷<br />
2.无副本，野外大量强化怪物，武器靠运气<br />
3.无副本，野外少量强化怪物，武器靠自己附魔（附魔系统增强）<br />
4.纯副本，武器靠怪物掉落的强化石进行强化<br />
5.有副本，野外又有怪，附魔即被增强，又可以强化武器（这个配置起来比较麻烦）<br />
