你把config.yml文件重命名为随便什么名字.yml（这是为了保存你的配置信息，没有需要就算了）<br />
然后输入end关闭跨服端再重启后重新生成新的config.yml这时再打开编辑，编辑用的软件最好不要用记事本<br />
