<b>标题: </b>用forge做好的mod怎么打包用在客户端上<br />eclipse写好了一份mod，点击run可以正常运行，但是不知道怎么打包用在客户端？<br />

<b>作者: </b>美_道心痛&nbsp; &nbsp; <b>时间: </b>2013-11-20 17:25<br />
在目录下安装一个相同版本的带有forge的mc，然后运行一次（进入游戏世界），然后关掉mc，打开游戏目录，放进mods文件夹，然后重开游戏就可以了- -
