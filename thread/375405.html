<b>标题: </b>服务器飞行问题<br />怎么禁止玩家在某世界飞行？玩家有开飞权利，怎么禁止他在一个世界不能使用飞行命令？》<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>wjxhahaha&nbsp; &nbsp; <b>时间: </b>2014-12-16 23:34<br />
首先你得设置好多世界多用户组，不同世界不共享用户组。然后如果你不想让玩家在A世界用飞行你可以在游戏里先传到A世界然后/manudelp 玩家名 essentials.fly 或者 /manuaddp 玩家名 -essentials.fly
