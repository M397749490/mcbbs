<b>标题: </b>玩家进服卡顿<br /><font size="2">玩家进服不输入密码服务器就会卡顿，有时候输入密码之后也会稍微卡顿，后台没有报错，有什么好的解决办法吗？MD5删除之后依然有这个情况。</font><font size="2"><br />
</font><br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>晓肖&nbsp; &nbsp; <b>时间: </b>2016-11-13 14:53<br />
模组服因为玩家进服需要检测一遍MOD<br />
所以卡顿是必然的<br />
某些纯净服插件 （例如:tplogin）<br />
玩家进服自动重载一次插件<br />
并且您插件配置有问题的情况下<br />
也会引起卡顿
