把Vault这个插件和moneydrop插件一起放到服务器plugins文件夹，启动一次服务器然后关闭，在plugins/MoneyDrop文件夹里编辑和保存yml配置文件，然后启动服务器即可。<br />
<br />
配置文件编辑项目很多，在此不介绍。如果看得懂英语，请去<a href="http://dev.bukkit.org/server-mods/moneydrop/" target="_blank">插件页</a>看
