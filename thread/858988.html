<b>标题: </b>关于多人联机的一些感想<br />每次联机玩耍总是要捣鼓好一阵=因为每个朋友喜好不一样，等把客户端+服务端搞定不少人都走了...<br />
而整合包联机又会出现fml等各种问题，于是对局域网开放成为了最好的选择。。<br />
可客户端游戏对局域网开放貌似无法指定端口，所以映射那边又要疯狂捣鼓一阵...<br />
多人服务器又失去了原来的味道，所以一提起一起玩Minecraft我就开始烦躁=<br />
