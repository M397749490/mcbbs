<b>标题: </b>匠魂。 避免出现自动冶炼强化<br />如何通过修改配置文件禁止随机出现的自动冶炼强化。&nbsp;&nbsp;空岛刷石机太容易出自动冶炼了。或者有其他手段避免出自动冶炼。<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>youyihj&nbsp; &nbsp; <b>时间: </b>2018-9-14 21:22<br />
打开config\IguanaTinkerTweaks\main.cfg文件<br />
找到这一行<br />
&nbsp; &nbsp; B:allowAutosmelt=true<br />
把true改成false即可
