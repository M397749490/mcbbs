<div align="center">招聘主播</div><br />
<div align="center">要求：平时观看人数达到40+的</div><br />
<div align="center">工资看业绩</div><br />
<div align="center">如果玩家赞助的多，那么获得的工资也就多</div><br />
<div align="center">比如有一个玩家赞助了10rmb</div><br />
<div align="center">那么主播就能获得2元</div><div align="center">（注意：如果人是从BBS来的，那么这个玩家赞助了，主播将无法获得工资，玩家进群的时候需要标注：主播）</div><br />
