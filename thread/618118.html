<b>标题: </b>Authme插件问题<br />这个插件有个一定时间内登录不需要密码，怎么把这个关掉，弄成每次登录都需要密码<br />
<hr noshade size="2" width="100%" color="#808080">
<b>作者: </b>xRPQx&nbsp; &nbsp; <b>时间: </b>2016-8-9 17:28<br />
打开authme<br />
打开config<br />
搜索<br />
sessions:<br />
找到↓<br />
 enabled: true<br />
设置为false<br />
/authme reload<br />
即可<br />
<strong>sessions:<br />
&nbsp; &nbsp;&nbsp; &nbsp;&nbsp;&nbsp;enabled: false</strong>
